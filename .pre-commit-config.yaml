repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # Type-check exactly what CI does. Passing changed filenames would
        # override pyproject's `files` and make the hook and CI disagree.
        pass_filenames: false
        additional_dependencies: [duckdb, pytest, jsonschema, types-jsonschema]
