# Static and fake-host gates only. Nothing here touches Docker, the network
# path to any bucket, or host firewall state: the live activation sequence is
# owner-run on a disposable runner (docs/operating/runner-security.md) and must never
# ride on pull-request CI.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned shellcheck (user path — no privileged host mutation)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/shellcheck-v0.10.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      - name: bash -n over every tracked shell script
        run: |
          set -euo pipefail
          git ls-files '*.sh' | while read -r f; do bash -n "$f"; done

      - name: Mask docker for the static gates
        # The suites are designed to run without Docker, but one regression
        # path issues a read-only `docker image inspect` that would reach the
        # hosted runner's daemon. A failing PATH shim keeps every step below
        # provably daemon-free.
        run: |
          set -euo pipefail
          mkdir -p /tmp/no-docker
          printf '#!/bin/sh\necho "docker is masked in pull-request CI (static gates only)" >&2\nexit 1\n' > /tmp/no-docker/docker
          chmod +x /tmp/no-docker/docker
          echo "/tmp/no-docker" >> "$GITHUB_PATH"

      - name: Full-tree secret scan
        # Before `uv sync`: the scan reads every file under the tree, and a
        # populated `.venv/` puts third-party binaries in front of it.
        run: PYTHONPATH=src python3 -P -m s3_listing_study.receipt scan-tree .

      - name: Install uv
        # The harness suite drives the packaged verifier, whose field comparison
        # runs on DuckDB. It gets the locked project environment rather than
        # whatever the runner's python3 happens to import.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked

      - name: Harness regression suite (includes the harness shellcheck gate)
        run: harness/tests/run-regressions.sh

      - name: Tool adapter shellcheck
        run: shellcheck -S warning tools/*/adapter/run.sh tools/*/adapter/fixtures/*.sh

      - name: s3p adapter fixture QA
        run: tools/s3p/adapter/fixtures/check.sh

      - name: Current capsule validation (all runnable tools)
        # The validator and the link checker are packaged subcommands, so they
        # run from the locked environment: jsonschema is a declared dependency
        # of this project, pinned by uv.lock, not a closure the workflow
        # provisions on the side.
        run: |
          set -euo pipefail
          for tool in aws-cli minio-mc ps3 rclone s3-fast-list s3kor s3p s4cmd s5cmd s7cmd swath; do
            uv run s3-listing-study validate-capsule --tool "$tool"
          done

      - name: Source-anchor gate self-test (this job verifies no project anchor)
        # Every `source` evidence entry pins a repository, a commit, and often a
        # line range in a checkout that does not live in this repo, and a hosted
        # runner has none of those checkouts. So CI cannot verify a single
        # project anchor, and this step no longer implies otherwise. A
        # checkout-free sweep used to run here as well: with no --source-root it
        # reported every anchor as skipped and exited 0, a green tick for work
        # not done, which is the exact failure this gate exists to prevent. It
        # is gone, and it verified nothing the capsule-validation step above
        # does not already cover — that step parses and schema-checks every
        # ledger. What remains is the checker's self-test, which builds a
        # throwaway repository and proves the gate still catches an out-of-range
        # line range, a path missing at the cited commit, a source root sitting
        # on the wrong revision, a supplied checkout that would otherwise be
        # silently ignored, and a prose label whose complete path names nothing
        # at the commit.
        #
        # The sweep over this repo's own anchors is run by whoever holds the
        # pinned checkouts, with --require-checked so it cannot pass having
        # checked nothing:
        #   uv run s3-listing-study check-source-anchors --tool swath --require-checked \
        #     --source-root /path/to/swath-at-cef8ec2
        run: uv run s3-listing-study check-source-anchors --self-test

      - name: Markdown link check (current-state surfaces)
        run: uv run s3-listing-study check-links

  python-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: pytest
        # Deselect the oracle-backed gates: the reference data they read is
        # deliberately not in the repo, so CI cannot judge them. Deselecting
        # here states that where it is configured, rather than letting a test
        # self-skip and read as a pass. Run them locally with `-m oracle`.
        run: uv run pytest -m "not oracle"
