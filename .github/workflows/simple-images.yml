name: simple toolbox image smoke

on:
  workflow_dispatch:
    inputs:
      build-inputs-json:
        description: Schema-1 JSON naming the shared base and every immutable tool parent
        required: true
        type: string
      harness-revision:
        description: Full lowercase 40-character harness commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Stage immutable parent set outside the checkout
        env:
          TOOLBOX_BUILD_INPUTS: ${{ inputs['build-inputs-json'] }}
          HARNESS_REVISION: ${{ inputs['harness-revision'] }}
        run: |
          set -euo pipefail
          [[ "$HARNESS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HARNESS_REVISION"
          printf '%s\n' "$TOOLBOX_BUILD_INPUTS" > /tmp/simple-toolbox-build-inputs.json

      - name: Build the single toolbox image without publishing
        env:
          HARNESS_REVISION: ${{ inputs['harness-revision'] }}
        run: |
          set -euo pipefail
          uv run python simple/build_image.py \
            --build-inputs /tmp/simple-toolbox-build-inputs.json \
            --harness-revision "$HARNESS_REVISION" \
            --tag simple-candidate:smoke

      - name: Smoke every registered executable and the worker
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id simple-candidate:smoke -u)" = 10001
          docker run --rm simple-candidate:smoke --help
          docker run --rm -i --entrypoint /usr/bin/python3 simple-candidate:smoke - <<'PY'
          import json
          import subprocess

          with open('/opt/simple/image-metadata.json', encoding='utf-8') as source:
              tools = json.load(source)['tools']
          for tool, metadata in sorted(tools.items()):
              result = subprocess.run(
                  [*metadata['executable'], '--help'],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=30,
                  check=False,
                  text=True,
              )
              expected = 252 if tool == 'aws-cli' else 0
              if result.returncode != expected or not result.stdout.strip():
                  raise SystemExit(f'{tool}: help smoke failed with {result.returncode}')
          PY
