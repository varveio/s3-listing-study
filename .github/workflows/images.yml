# The image build and publication itself, called by images-pr.yml (validate) and
# images-publish.yml (publish). Both callers run identical jobs; the only
# difference is `push` and the permissions the caller declares.
#
# Permissions cannot be computed from an expression, which is why the publish
# path is a separate caller rather than a duplicated set of jobs behind a
# repeated boolean. `packages: write` exists in exactly one file, and a workflow
# that is not that file cannot publish however it is triggered.
#
# The graph is sized by what the registry is missing. `plan` probes every
# reference once, and a bucket that comes back empty produces no job at all,
# because an empty matrix creates zero jobs rather than one that skips. On the
# common change — Python only, both parents already published — `shared` and
# `chain` do not exist and `bake` builds eleven thin layers in one BuildKit
# instance.
name: images

on:
  workflow_call:
    inputs:
      push:
        description: Publish validated images to GHCR rather than only building them
        required: true
        type: boolean
      ref-name:
        description: The branch whose channel this run publishes
        required: true
        type: string
      main-publication:
        description: Publish to the main channel rather than a branch channel
        required: false
        default: false
        type: boolean
      tools:
        description: Comma-separated tool slugs, or empty for the whole roster
        required: false
        default: ""
        type: string

env:
  GHCR_REPOSITORY: ghcr.io/varveio/s3-listing-study
  # Belt and braces with the per-target `attest` entries the bake file carries:
  # a published image must be a plain manifest, so the digest promoted names the
  # image and not an attestation index. `ci verify-published` asserts the result.
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel-suffix: ${{ steps.plan.outputs.channel-suffix }}
      shared-tag: ${{ steps.plan.outputs.shared-tag }}
      shared-needed: ${{ steps.plan.outputs.shared-needed }}
      shared-digest: ${{ steps.plan.outputs.shared-digest }}
      set-channel-tag: ${{ steps.plan.outputs.set-channel-tag }}
      chain-matrix: ${{ steps.plan.outputs.chain-matrix }}
      bake-tools: ${{ steps.plan.outputs.bake-tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Authenticate for registry reads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Resolves every shared, tool, and execution reference concurrently over the
      # registry API. No layer is pulled; the whole probe is a few hundred
      # milliseconds and needs only read access.
      # Ref names and the tool filter reach the shell only through the
      # environment. A branch name may legally contain quotes, semicolons and
      # backticks, and a fork pull request chooses it: interpolating one into a
      # script body is arbitrary code execution on the runner.
      - name: Resolve what still needs building
        id: plan
        env:
          REF_NAME: ${{ inputs.ref-name }}
          TOOLS: ${{ inputs.tools }}
          MAIN_PUBLICATION: ${{ inputs.main-publication }}
        run: |
          set -euo pipefail
          arguments=(--repository "$GHCR_REPOSITORY" --ref-name "$REF_NAME")
          [ "$MAIN_PUBLICATION" = true ] && arguments+=(--main-publication)
          [ -n "$TOOLS" ] && arguments+=(--tools "$TOOLS")
          uv run s3-listing-study ci plan "${arguments[@]}" --output image-build-plan.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-plan
          path: image-build-plan.json
          if-no-files-found: error
          retention-days: 30

  # Only when the shared runtime's own inputs changed. Publishing runs push it so
  # every downstream build names a real GHCR digest; validating runs keep it as a
  # content-addressed OCI layout, whose digest buildx reports and a registry would
  # assign identically.
  shared:
    name: Shared runtime
    needs: plan
    if: needs.plan.outputs.shared-needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: inputs.push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build the shared runtime
        id: build
        env:
          SHARED_TAG: ${{ needs.plan.outputs.shared-tag }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = true ]; then
            output="type=registry"
          else
            output="type=oci,dest=shared-oci,tar=false"
          fi
          uv run s3-listing-study build-shared-image \
            --tag "$SHARED_TAG" --output "$output" --metadata-file shared-meta.json
          digest=$(uv run python -c 'import json;print(json.load(open("shared-meta.json"))["containerimage.digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload the shared runtime layout
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-oci
          path: shared-oci
          retention-days: 1
          if-no-files-found: error

  # One job per tool whose parent must be built. The tool image and its execution
  # child are built together because an unpublished parent's bytes never leave the
  # job that produced them. No max-parallel: this is the only genuinely expensive
  # compute in the pipeline, and separate runners are what make it parallel.
  chain:
    name: Build ${{ matrix.tool }}
    needs: [plan, shared]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.chain-matrix != '[]' && needs.shared.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.chain-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Fetch the shared runtime layout
        if: ${{ needs.plan.outputs.shared-needed == 'true' && !inputs.push }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-oci
          path: shared-oci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-plan

      - name: Resolve this tool's planned identities
        id: identity
        run: |
          uv run s3-listing-study ci tool-tags \
            --plan image-build-plan.json --tool '${{ matrix.tool }}'

      - name: Build the tool parent and its execution child
        env:
          TOOL: ${{ matrix.tool }}
          PUSH: ${{ inputs.push }}
          SHARED_DIGEST: ${{ needs.shared.outputs.digest || needs.plan.outputs.shared-digest }}
          TOOL_TAG: ${{ steps.identity.outputs.tool-tag }}
          EXECUTION_TAG: ${{ steps.identity.outputs.execution-tag }}
        run: |
          set -euo pipefail
          shared_reference="$GHCR_REPOSITORY@$SHARED_DIGEST"
          shared_layout=()
          [ -d shared-oci ] && shared_layout=(--parent-layout "$PWD/shared-oci")
          if [ "$PUSH" = true ]; then
            tool_output="type=registry"
            execution_output="type=registry"
          else
            tool_output="type=oci,dest=tool-oci,tar=false"
            execution_output="type=cacheonly"
          fi

          uv run s3-listing-study build-tool-image \
            --tool "$TOOL" --shared-base-image "$shared_reference" --tag "$TOOL_TAG" \
            --output "$tool_output" --metadata-file tool-meta.json "${shared_layout[@]}"
          tool_digest=$(uv run python -c 'import json;print(json.load(open("tool-meta.json"))["containerimage.digest"])')

          # The parent is always named by digest, so the execution image records
          # the same provenance whether the parent came from GHCR or a layout.
          tool_layout=()
          [ -d tool-oci ] && tool_layout=(--parent-layout "$PWD/tool-oci")
          uv run s3-listing-study build-derived-image \
            --tool "$TOOL" --tool-image "$GHCR_REPOSITORY@$tool_digest" --tag "$EXECUTION_TAG" \
            --output "$execution_output" --metadata-file execution-meta.json "${tool_layout[@]}"


  # Every tool whose parent is published and whose worker layer is not: one job,
  # one bake, all targets concurrent in a single BuildKit instance that pulls the
  # shared parent layers once. Pushing a thin layer to the same repository as its
  # parent cross-mounts the parent blobs, so only the new layer is uploaded.
  bake:
    name: Bake worker layers
    needs: [plan, shared, chain]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.bake-tools != '[]' && needs.shared.result != 'failure' && needs.chain.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-plan

      - name: Generate the bake definition
        run: |
          set -euo pipefail
          uv run s3-listing-study ci bake-file \
            --plan image-build-plan.json --output bake.json \
            ${{ inputs.push && '--push' || '' }}
          cat bake.json

      - name: Bake every worker layer
        run: docker buildx bake -f bake.json --metadata-file bake-meta.json

      - name: Check every planned target against what bake reported
        env:
          PUSH: ${{ inputs.push && 'true' || '' }}
        run: |
          set -euo pipefail
          uv run s3-listing-study ci assert-digests \
            --plan image-build-plan.json --metadata bake-meta.json \
            --output baked-digests.json ${PUSH:+--push}
          cat baked-digests.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baked-digests
          path: baked-digests.json
          if-no-files-found: error
          retention-days: 30

  # Nothing movable changes until every image is published and verified. The
  # individual execution channels may move one at a time, but the authoritative
  # set channel moves last, so it never advertises an incomplete set.
  promote:
    name: Publish and promote
    needs: [plan, shared, chain, bake]
    if: ${{ !cancelled() && inputs.push && needs.plan.result == 'success' && needs.shared.result != 'failure' && needs.chain.result != 'failure' && needs.bake.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Only the plan is needed here; the bake job's digests are re-resolved from
      # the registry below rather than trusted from a build's own report.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-plan
          path: incoming/image-build-plan

      # Re-resolves every reference against GHCR rather than trusting a build's
      # own report: the authoritative digest is the one the registry assigns.
      # Deliberately re-planned over the WHOLE roster, never `inputs.tools`. A
      # run may build a subset, but the set channel asserts that all eleven
      # execution channels form one ready publication, so the ledger it points at
      # must describe all eleven. Re-planning a subset here would advance
      # `set-<suffix>` onto a partial ledger and silently orphan the rest.
      - name: Re-resolve the whole published set
        env:
          REF_NAME: ${{ inputs.ref-name }}
          MAIN_PUBLICATION: ${{ inputs.main-publication }}
        run: |
          set -euo pipefail
          arguments=(--repository "$GHCR_REPOSITORY" --ref-name "$REF_NAME")
          [ "$MAIN_PUBLICATION" = true ] && arguments+=(--main-publication)
          uv run s3-listing-study ci plan "${arguments[@]}" --output re-resolved.json
          uv run s3-listing-study ci reconcile \
            --planned incoming/image-build-plan/image-build-plan.json \
            --published re-resolved.json --output published-plan.json

      - name: Verify every published image from its manifest
        run: uv run s3-listing-study ci verify-published --plan published-plan.json

      - name: Assemble the publication manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          uv run s3-listing-study ci publication-manifest \
            --plan published-plan.json \
            --checkout-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --pull-request-number "$PR_NUMBER" \
            --pull-request-base-sha "$PR_BASE_SHA" \
            --pull-request-head-sha "$PR_HEAD_SHA" \
            --output ghcr-publication-manifest.json

      # The durable ledger: an image whose only content is the manifest bytes.
      # It outlives artifact retention, and it is pulled back and compared before
      # anything downstream trusts it.
      - name: Derive the ledger tag from the manifest bytes
        id: ledger-tag
        run: |
          set -euo pipefail
          uv run s3-listing-study ci ledger-tag \
            --manifest ghcr-publication-manifest.json --repository "$GHCR_REPOSITORY"

      - name: Publish the immutable publication-set ledger
        id: ledger
        env:
          LEDGER_TAG: ${{ steps.ledger-tag.outputs.version-tag }}
          LEDGER_EXISTS: ${{ steps.ledger-tag.outputs.exists }}
          LEDGER_EXISTING_DIGEST: ${{ steps.ledger-tag.outputs.existing-digest }}
          # Without this BuildKit stamps the image config with wall-clock time, so
          # an identical manifest would still yield a new digest on a re-run.
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          set -euo pipefail
          if [ "$LEDGER_EXISTS" = true ]; then
            digest="$LEDGER_EXISTING_DIGEST"
          else
            # A dedicated context. The repository's .dockerignore denies `*` and
            # re-includes only src/, harness/ and three files under tools/, so a
            # root-level file is invisible to a build rooted at the checkout and the
            # ledger could never find its own input. Re-including it there instead
            # would leak it into every derived-image context.
            rm -rf ledger-context && mkdir ledger-context
            cp ghcr-publication-manifest.json ledger-context/manifest.json
            touch -d '1980-01-01 00:00:00 UTC' ledger-context/manifest.json
            docker buildx build --provenance=false --sbom=false \
              --file - --tag "$LEDGER_TAG" --output type=registry \
              --metadata-file ledger-meta.json ledger-context <<'DOCKERFILE'
          FROM scratch
          COPY manifest.json /manifest.json
          DOCKERFILE
            digest=$(uv run python -c 'import json;print(json.load(open("ledger-meta.json"))["containerimage.digest"])')
          fi

          # Pull the sealed bytes back and compare them, whether we just wrote them
          # or adopted an earlier publication's. `imagetools inspect --raw` returns
          # the manifest, not the payload, so it could never catch a ledger whose
          # content differed from what we assembled.
          docker create --name ledger-check "$GHCR_REPOSITORY@$digest" /manifest.json > /dev/null
          docker cp ledger-check:/manifest.json pulled-ledger.json
          docker rm ledger-check > /dev/null
          cmp ghcr-publication-manifest.json pulled-ledger.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record what every channel points at before anything moves
        env:
          LEDGER_TAG: ${{ steps.ledger-tag.outputs.version-tag }}
        run: |
          set -euo pipefail
          uv run s3-listing-study ci promotion-report \
            --plan published-plan.json \
            --checkout-revision "$GITHUB_SHA" \
            --set-digest '${{ steps.ledger.outputs.digest }}' \
            --set-version-tag "$LEDGER_TAG" \
            --output promotion-report.json

      - name: Promote the execution channels
        run: |
          set -euo pipefail
          uv run s3-listing-study ci channels --plan published-plan.json --output channels.tsv
          # The worklist is read on a dedicated descriptor so no command inside
          # the loop can consume it and cut the promotion short.
          while IFS=$'\t' read -r tool reference channel_tag <&3; do
            docker buildx imagetools create --prefer-index=false \
              --metadata-file promotion-metadata.json --tag "$channel_tag" "$reference"
            promoted=$(uv run python -c 'import json;print(json.load(open("promotion-metadata.json"))["containerimage.descriptor"]["digest"])')
            uv run s3-listing-study ci record-promotion \
              --report promotion-report.json --tool "$tool" --promoted-digest "$promoted"
          done 3< channels.tsv

      # The set channel is the claim that every execution channel moved. That
      # claim is checked here rather than resting on the loop above having
      # iterated the number of times we expected.
      - name: Refuse to advertise an incomplete set
        run: uv run s3-listing-study ci assert-promoted --report promotion-report.json

      - name: Advance the authoritative set channel last
        env:
          SET_CHANNEL_TAG: ${{ needs.plan.outputs.set-channel-tag }}
          SET_DIGEST: ${{ steps.ledger.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            --metadata-file set-metadata.json --tag "$SET_CHANNEL_TAG" \
            "$GHCR_REPOSITORY@$SET_DIGEST"
          promoted=$(uv run python -c 'import json;print(json.load(open("set-metadata.json"))["containerimage.descriptor"]["digest"])')
          uv run s3-listing-study ci record-promotion \
            --report promotion-report.json --publication-set --promoted-digest "$promoted"

      # Standard SLSA provenance, attached after the push through the referrers
      # API so it is verifiable with `gh attestation verify` without changing any
      # published digest.
      - name: Attest the publication set
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.GHCR_REPOSITORY }}
          subject-digest: ${{ steps.ledger.outputs.digest }}
          push-to-registry: true

      - name: Upload the publication record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-record
          path: |
            ghcr-publication-manifest.json
            promotion-report.json
            published-plan.json
          if-no-files-found: warn
          retention-days: 30
