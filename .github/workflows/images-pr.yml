# Pull-request image validation. This file can never publish: it grants
# `packages: read` and calls the shared workflow with `push: false`, and a
# reusable workflow runs under its caller's permissions. That is the whole
# enforcement — no boolean anywhere in the build decides whether a PR may write
# to the registry, because the token it runs with cannot.
#
# The path list is the set of repository inputs that can change an image, and it
# must stay equal to the inputs hashed into the shared-base and derived-image
# identities. `test_derived_source_identity_and_workflow_triggers_cover_every_copy_input`
# fails if the two drift apart.
name: image builds (pull request)

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/images-pr.yml
      - .github/workflows/images.yml
      - harness/derived-image/**
      - harness/shared-image/**
      - pyproject.toml
      - src/s3_listing_study/__init__.py
      - src/s3_listing_study/ci/**
      - src/s3_listing_study/common/**
      - src/s3_listing_study/worker/**
      - src/twinstamp/**
      - tools/*/adapter/**
      - tools/*/build/**
      - uv.lock

permissions:
  contents: read
  packages: read

concurrency:
  group: images-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: read
    with:
      push: false
      ref-name: ${{ github.head_ref }}
