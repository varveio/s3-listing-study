name: image builds

# Ordinary pull-request events only build temporary CI artifacts. A push to
# main publishes validated version tags and advances the main execution channel.
# Before merge, publish a same-repository PR explicitly with the `publish-images`
# label, or dispatch this workflow with publish_to_ghcr=true.
# Historical digest/run tags remain in GHCR for later retention work; this
# workflow creates only canonical version tags and movable channel tags.
# Publication runs share one concurrency group. GitHub keeps one running and
# one pending member, so several rapid publication requests coalesce to the
# newest pending request without an ordinary build cancelling publication.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .dockerignore
      - .github/workflows/images-pr.yml
      - harness/derived-image/**
      - harness/shared-image/**
      - pyproject.toml
      - src/s3_listing_study/__init__.py
      - src/s3_listing_study/common/**
      - src/s3_listing_study/worker/**
      - tools/*/adapter/**
      - tools/*/build/**
      - uv.lock
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/images-pr.yml
      - harness/derived-image/**
      - harness/shared-image/**
      - pyproject.toml
      - src/s3_listing_study/__init__.py
      - src/s3_listing_study/common/**
      - src/s3_listing_study/worker/**
      - tools/*/adapter/**
      - tools/*/build/**
      - uv.lock
  workflow_dispatch:
    inputs:
      publish_to_ghcr:
        description: Publish this selected branch's validated images to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
    (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
    github.event.label.name == 'publish-images' &&
    github.event.pull_request.head.repo.full_name == github.repository)) &&
    format('images-{0}-publication', github.repository)) ||
    format('images-{0}-{1}-{2}-{3}-{4}', github.workflow, github.ref,
    github.event_name, github.event.action, github.event.label.name) }}
  cancel-in-progress: >-
    ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
    (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
    github.event.label.name == 'publish-images' &&
    github.event.pull_request.head.repo.full_name == github.repository)) }}

env:
  GHCR_REPOSITORY: ghcr.io/varveio/s3-listing-study
  SHARED_ARCHIVE_TAG: s3-listing-study/shared-ci:content
  LOCAL_REGISTRY: localhost:5000

jobs:
  shared-runtime:
    if: github.event.action != 'labeled' || github.event.label.name == 'publish-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      input-hash: ${{ steps.shared-key.outputs.value }}
      reuse-source: ${{ steps.shared-source.outputs.value }}
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calculate shared-runtime cache key
        id: shared-key
        run: |
          set -euo pipefail
          value=$(PYTHONPATH=src python3 -c \
            'from pathlib import Path; from s3_listing_study.common.build_selection import shared_base_source_sha256; print(shared_base_source_sha256(Path.cwd()))')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Restore shared-runtime archive
        id: shared-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: shared-runtime.tar.gz
          key: image-shared-${{ runner.os }}-${{ steps.shared-key.outputs.value }}

      - name: Restore canonical shared runtime from GHCR
        if: steps.shared-cache.outputs.cache-hit != 'true'
        id: shared-registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARED_INPUT_HASH: ${{ steps.shared-key.outputs.value }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          canonical_tag="$GHCR_REPOSITORY:shared-python3.11-${SHARED_INPUT_HASH:0:12}"
          pull_error=$(mktemp)
          if docker image pull "$canonical_tag" 2>"$pull_error"; then
            test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.shared-base-source-sha256"}}' "$canonical_tag")" = "$SHARED_INPUT_HASH"
            test "$(docker run --rm --pull=never "$canonical_tag" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_INPUT_HASH"
            docker run --rm --pull=never "$canonical_tag" /usr/bin/python3 -I -c \
              'import sys; assert sys.version_info[:2] == (3, 11)'
            docker image tag "$canonical_tag" "$SHARED_ARCHIVE_TAG"
            docker image save "$SHARED_ARCHIVE_TAG" | gzip -1 > shared-runtime.tar.gz
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found' "$pull_error"; then
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          else
            cat "$pull_error" >&2
            exit 1
          fi

      - name: Install uv
        if: steps.shared-cache.outputs.cache-hit != 'true' && steps.shared-registry.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        if: steps.shared-cache.outputs.cache-hit != 'true' && steps.shared-registry.outputs.cache-hit != 'true'
        run: uv sync --locked

      - name: Set up Buildx
        if: steps.shared-cache.outputs.cache-hit != 'true' && steps.shared-registry.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build shared runtime on cache miss
        if: steps.shared-cache.outputs.cache-hit != 'true' && steps.shared-registry.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          uv run s3-listing-study build-shared-image --tag "$SHARED_ARCHIVE_TAG"
          docker image save "$SHARED_ARCHIVE_TAG" | gzip -1 > shared-runtime.tar.gz

      - name: Record shared-runtime reuse source
        id: shared-source
        env:
          ACTIONS_CACHE_HIT: ${{ steps.shared-cache.outputs.cache-hit }}
          GHCR_CACHE_HIT: ${{ steps.shared-registry.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$ACTIONS_CACHE_HIT" = true ]; then
            source=actions-cache
          elif [ "$GHCR_CACHE_HIT" = true ]; then
            source=ghcr
          else
            source=rebuilt
          fi
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "Shared runtime source: **$source**" >> "$GITHUB_STEP_SUMMARY"

      - name: Load and probe shared runtime
        run: |
          set -euo pipefail
          gunzip -c shared-runtime.tar.gz | docker image load
          test "$(docker image inspect --format '{{.Config.User}}' "$SHARED_ARCHIVE_TAG")" = "10001:10001"
          docker run --rm --pull=never "$SHARED_ARCHIVE_TAG" \
            /usr/bin/python3 -I -c 'import duckdb, json, platform, sys; assert sys.version_info[:2] == (3, 11); print(json.dumps({"duckdb": duckdb.__version__, "python": platform.python_version()}, sort_keys=True))'

      - name: Upload shared runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-runtime
          path: shared-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  assemble-execution:
    name: Assemble execution (${{ matrix.tool }})
    needs: shared-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tool:
          - aws-cli
          - minio-mc
          - ps3
          - rclone
          - s3-fast-list
          - s3kor
          - s3p
          - s4cmd
          - s5cmd
          - s7cmd
          - swath
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Resolve canonical image inputs
        id: identity
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          uv run python - <<'PY'
          import os
          import pathlib
          import tomllib

          from s3_listing_study import __version__
          from s3_listing_study.common.build_selection import (
              derived_image_source_sha256,
              docker_tag_version,
              load_registered_selection,
          )

          root = pathlib.Path.cwd()
          selection = load_registered_selection(root, os.environ["TOOL"])
          project_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          if project_version != __version__:
              raise SystemExit("pyproject project.version differs from package __version__")
          tag_version = docker_tag_version(selection.tool_version)
          values = {
              "selection-sha256": selection.selection_sha256,
              "shared-source-sha256": selection.shared_base_source_sha256,
              "tool-build-sha256": selection.tool_build_sha256,
              "tool-tag-version": tag_version,
              "tool-version": selection.tool_version,
              "worker-source-sha256": derived_image_source_sha256(root, selection),
              "worker-tag-version": docker_tag_version(project_version),
              "worker-version": project_version,
          }
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  print(f"{key}={value}", file=stream)
          PY

      - name: Download shared runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-runtime

      - name: Start job-local registry
        run: |
          set -euo pipefail
          gunzip -c shared-runtime.tar.gz | docker image load
          docker run --detach --name image-registry --publish 5000:5000 \
            registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/v2/ >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker image tag "$SHARED_ARCHIVE_TAG" "$LOCAL_REGISTRY/runtime/shared:ci"
          docker image push "$LOCAL_REGISTRY/runtime/shared:ci"

      - name: Resolve shared runtime digest
        id: shared
        run: |
          set -euo pipefail
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$LOCAL_REGISTRY/runtime/shared:ci" \
            | awk -v prefix="$LOCAL_REGISTRY/runtime/shared@" 'index($0, prefix) == 1 { print; exit }')
          case "$reference" in
            "$LOCAL_REGISTRY/runtime/shared@sha256:"*) ;;
            *) echo "unexpected shared-runtime reference: $reference" >&2; exit 1 ;;
          esac
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"

      - name: Set up digest-aware Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Restore tool-parent archive
        id: tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tool-cache/${{ matrix.tool }}.tar.gz
          key: image-tool-${{ runner.os }}-${{ steps.identity.outputs.shared-source-sha256 }}-${{ steps.identity.outputs.tool-build-sha256 }}

      - name: Log in for canonical GHCR reuse
        if: steps.tool-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Load or build tool image
        id: tool-source
        env:
          TOOL: ${{ matrix.tool }}
          SHARED_REFERENCE: ${{ steps.shared.outputs.reference }}
          SHARED_SOURCE_SHA256: ${{ steps.identity.outputs.shared-source-sha256 }}
          TOOL_BUILD_SHA256: ${{ steps.identity.outputs.tool-build-sha256 }}
          TOOL_TAG_VERSION: ${{ steps.identity.outputs.tool-tag-version }}
        run: |
          set -euo pipefail
          tool_tag="$LOCAL_REGISTRY/tool/$TOOL:ci"
          mkdir -p tool-cache
          if [ "${{ steps.tool-cache.outputs.cache-hit }}" = "true" ]; then
            gunzip -c "tool-cache/$TOOL.tar.gz" | docker image load
            source=actions-cache
          else
            canonical_tag="$GHCR_REPOSITORY:tool-$TOOL-v$TOOL_TAG_VERSION-base-${SHARED_SOURCE_SHA256:0:12}-build-${TOOL_BUILD_SHA256:0:12}"
            pull_error=$(mktemp)
            if docker image pull "$canonical_tag" 2>"$pull_error"; then
              test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.tool-build-sha256"}}' "$canonical_tag")" = "$TOOL_BUILD_SHA256"
              test "$(docker run --rm --pull=never "$canonical_tag" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_SOURCE_SHA256"
              docker image tag "$canonical_tag" "$tool_tag"
              source=ghcr
            elif grep -Eqi 'manifest unknown|not found' "$pull_error"; then
              uv run s3-listing-study build-tool-image \
                --tool "$TOOL" --shared-base-image "$SHARED_REFERENCE" --tag "$tool_tag"
              source=rebuilt
            else
              cat "$pull_error" >&2
              exit 1
            fi
            docker image save "$tool_tag" | gzip -1 > "tool-cache/$TOOL.tar.gz"
          fi
          test "$(docker image inspect --format '{{.Config.User}}' "$tool_tag")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.tool-build-sha256"}}' "$tool_tag")" = "$TOOL_BUILD_SHA256"
          test "$(docker run --rm --pull=never "$tool_tag" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_SOURCE_SHA256"
          docker image push "$tool_tag"
          tool_reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tool_tag" \
            | awk -v prefix="$LOCAL_REGISTRY/tool/$TOOL@" 'index($0, prefix) == 1 { print; exit }')
          case "$tool_reference" in
            "$LOCAL_REGISTRY/tool/$TOOL@sha256:"*) ;;
            *) echo "unexpected tool-image reference: $tool_reference" >&2; exit 1 ;;
          esac
          printf 'TOOL_TAG=%s\nTOOL_REFERENCE=%s\n' \
            "$tool_tag" "$tool_reference" >> "$GITHUB_ENV"
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "$TOOL tool parent source: **$source**" >> "$GITHUB_STEP_SUMMARY"

      - name: Build execution image
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          execution_tag="$LOCAL_REGISTRY/execution/$TOOL:ci"
          uv run s3-listing-study build-derived-image \
            --tool "$TOOL" --tool-image "$TOOL_REFERENCE" --tag "$execution_tag"
          docker image push "$execution_tag"
          execution_reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$execution_tag" \
            | awk -v prefix="$LOCAL_REGISTRY/execution/$TOOL@" 'index($0, prefix) == 1 { print; exit }')
          case "$execution_reference" in
            "$LOCAL_REGISTRY/execution/$TOOL@sha256:"*) ;;
            *) echo "unexpected execution-image reference: $execution_reference" >&2; exit 1 ;;
          esac
          printf 'EXECUTION_TAG=%s\nEXECUTION_REFERENCE=%s\n' \
            "$execution_tag" "$execution_reference" >> "$GITHUB_ENV"

      - name: Inspect tool and worker images
        env:
          TOOL: ${{ matrix.tool }}
          TOOL_BUILD_SHA256: ${{ steps.identity.outputs.tool-build-sha256 }}
          SHARED_SOURCE_SHA256: ${{ steps.identity.outputs.shared-source-sha256 }}
          WORKER_SOURCE_SHA256: ${{ steps.identity.outputs.worker-source-sha256 }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$TOOL_TAG")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.tool-build-sha256"}}' "$TOOL_TAG")" = "$TOOL_BUILD_SHA256"
          test "$(docker run --rm --pull=never "$TOOL_TAG" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_SOURCE_SHA256"
          test "$(docker image inspect --format '{{.Config.User}}' "$EXECUTION_TAG")" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$EXECUTION_TAG")" = \
            '["/usr/bin/python3","-I","/opt/s3-listing-study/attempt.pyz"]'
          docker run --rm --pull=never --entrypoint /usr/bin/python3 "$EXECUTION_TAG" \
            -I -c 'import json,sys; p=json.load(open("/opt/s3-listing-study/image-provenance.json")); assert p["schema_version"] == 2; assert p["tool_image"]["uri"] == sys.argv[1]; assert p["worker_source_sha256"] == sys.argv[2]; assert len(p["selection_sha256"]) == 64' \
            "$TOOL_REFERENCE" "$WORKER_SOURCE_SHA256"

      - name: Export images and registration
        env:
          CHECKOUT_REVISION: ${{ github.sha }}
          PUBLISH_IMAGES: ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
            (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
            github.event.label.name == 'publish-images' &&
            github.event.pull_request.head.repo.full_name == github.repository) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TOOL: ${{ matrix.tool }}
          TOOL_BUILD_SHA256: ${{ steps.identity.outputs.tool-build-sha256 }}
          TOOL_TAG_VERSION: ${{ steps.identity.outputs.tool-tag-version }}
          TOOL_VERSION: ${{ steps.identity.outputs.tool-version }}
          SELECTION_SHA256: ${{ steps.identity.outputs.selection-sha256 }}
          SHARED_REUSE_SOURCE: ${{ needs.shared-runtime.outputs.reuse-source }}
          TOOL_REUSE_SOURCE: ${{ steps.tool-source.outputs.value }}
          WORKER_SOURCE_SHA256: ${{ steps.identity.outputs.worker-source-sha256 }}
          WORKER_TAG_VERSION: ${{ steps.identity.outputs.worker-tag-version }}
          WORKER_VERSION: ${{ steps.identity.outputs.worker-version }}
          SHARED_REFERENCE: ${{ steps.shared.outputs.reference }}
          SHARED_SOURCE_SHA256: ${{ steps.identity.outputs.shared-source-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          if [ "$PUBLISH_IMAGES" = true ]; then
            cp "tool-cache/$TOOL.tar.gz" "image-artifacts/$TOOL-tool.tar.gz"
          fi
          uv run python - "$TOOL" "$SHARED_REFERENCE" "$TOOL_REFERENCE" "$EXECUTION_REFERENCE" <<'PY'
          import json
          import os
          import pathlib
          import sys

          tool, shared, tool_image, execution = sys.argv[1:]
          digest = lambda reference: reference.rsplit("@", 1)[1]
          record = {
              "execution_image_digest": digest(execution),
              "shared_runtime_digest": digest(shared),
              "checkout_revision": os.environ["CHECKOUT_REVISION"],
              "pull_request": (
                  {
                      "base_sha": os.environ["PR_BASE_SHA"],
                      "head_sha": os.environ["PR_HEAD_SHA"],
                      "number": int(os.environ["PR_NUMBER"]),
                  }
                  if os.environ["PR_NUMBER"]
                  else None
              ),
              "shared_base_source_sha256": os.environ["SHARED_SOURCE_SHA256"],
              "shared_reuse_source": os.environ["SHARED_REUSE_SOURCE"],
              "selection_sha256": os.environ["SELECTION_SHA256"],
              "tool": tool,
              "tool_archive": (
                  f"{tool}-tool.tar.gz" if os.environ["PUBLISH_IMAGES"] == "true" else None
              ),
              "tool_build_sha256": os.environ["TOOL_BUILD_SHA256"],
              "tool_tag_version": os.environ["TOOL_TAG_VERSION"],
              "tool_image_digest": digest(tool_image),
              "tool_reuse_source": os.environ["TOOL_REUSE_SOURCE"],
              "tool_version": os.environ["TOOL_VERSION"],
              "worker_source_sha256": os.environ["WORKER_SOURCE_SHA256"],
              "worker_tag_version": os.environ["WORKER_TAG_VERSION"],
              "worker_version": os.environ["WORKER_VERSION"],
          }
          pathlib.Path(f"image-artifacts/{tool}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload tool image
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
          (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'publish-images' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-image-${{ matrix.tool }}
          path: image-artifacts/${{ matrix.tool }}-tool.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload image registration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registration-${{ matrix.tool }}
          path: image-artifacts/${{ matrix.tool }}.json
          if-no-files-found: error
          retention-days: 7

  summary:
    needs: assemble-execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download image registrations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: registration-*
          path: registrations

      - name: Assemble and validate CI build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          expected = {
              "aws-cli", "minio-mc", "ps3", "rclone", "s3-fast-list", "s3kor",
              "s3p", "s4cmd", "s5cmd", "s7cmd", "swath",
          }
          records = [json.loads(path.read_text()) for path in pathlib.Path("registrations").glob("**/*.json")]
          by_tool = {record["tool"]: record for record in records}
          if len(records) != len(by_tool) or set(by_tool) != expected:
              raise SystemExit("image registrations are missing, duplicated, or unexpected")
          shared = {record["shared_runtime_digest"] for record in records}
          if len(shared) != 1:
              raise SystemExit("tool images do not share one runtime digest")
          revisions = {record["checkout_revision"] for record in records}
          if len(revisions) != 1:
              raise SystemExit("tool images do not share one source revision")
          document = {
              "kind": "github-actions-image-build",
              "schema_version": 1,
              "images": by_tool,
          }
          pathlib.Path("image-build-manifest.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload aggregate CI build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-manifest
          path: image-build-manifest.json
          if-no-files-found: error
          retention-days: 7

  publication-plan:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'publish-images' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel-tag-suffix: ${{ steps.channel.outputs.tag-suffix }}
    steps:
      - name: Select the publication channel
        id: channel
        env:
          REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.event_name == 'pull_request' && 'branch' || github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ] &&
             { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            echo "tag-suffix=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF_TYPE" != branch ]; then
            echo "GHCR publication requires a branch ref, got: $REF_TYPE" >&2
            exit 1
          fi
          branch_slug=$(printf '%s' "$REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-+/-/g')
          branch_slug=${branch_slug:0:50}
          if [ -z "$branch_slug" ]; then
            echo "selected branch does not produce a safe Docker tag" >&2
            exit 1
          fi
          branch_hash=$(printf '%s' "$REF_NAME" | sha256sum | cut -c1-12)
          tag_suffix="branch-$branch_slug-$branch_hash"
          if ! [[ "$tag_suffix" =~ ^[a-z0-9_][a-z0-9._-]{0,127}$ ]]; then
            echo "invalid sanitized branch tag suffix: $tag_suffix" >&2
            exit 1
          fi
          echo "tag-suffix=$tag_suffix" >> "$GITHUB_OUTPUT"

  publish-shared:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'publish-images' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [shared-runtime, assemble-execution, publication-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
      version-tag: ${{ steps.publish.outputs.version-tag }}
    steps:
      - name: Download shared runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-runtime

      - name: Download canonical CI registration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registration-aws-cli
          path: ci-registration

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish shared runtime
        id: publish
        env:
          SHARED_INPUT_HASH: ${{ needs.shared-runtime.outputs.input-hash }}
        run: |
          set -euo pipefail
          if ! [[ "$SHARED_INPUT_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid shared-runtime input hash: $SHARED_INPUT_HASH" >&2
            exit 1
          fi
          gunzip -c shared-runtime.tar.gz | docker image load
          version_tag="$GHCR_REPOSITORY:shared-python3.11-${SHARED_INPUT_HASH:0:12}"
          version_tag_name=${version_tag##*:}
          if [ "${#version_tag_name}" -gt 128 ] ||
             ! [[ "$version_tag_name" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "invalid shared-runtime version tag: $version_tag_name" >&2
            exit 1
          fi
          registered_source=$(python3 - "ci-registration/aws-cli.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          record = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(record["shared_base_source_sha256"])
          PY
          )
          test "$registered_source" = "$SHARED_INPUT_HASH"
          inspect_remote() {
            local tag=$1 output error remote
            output=$(mktemp)
            error=$(mktemp)
            if docker buildx imagetools inspect "$tag" >"$output" 2>"$error"; then
              remote=$(sed -n 's/^Digest:[[:space:]]*//p' "$output" | head -n 1)
              [[ "$remote" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              printf '%s\n' "$remote"
            elif grep -Eqi 'manifest unknown|not found' "$error"; then
              printf '%s\n' absent
            else
              cat "$error" >&2
              return 1
            fi
          }
          verify_shared() {
            local image=$1
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
            test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.shared-base-source-sha256"}}' "$image")" = "$SHARED_INPUT_HASH"
            test "$(docker run --rm --pull=never "$image" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_INPUT_HASH"
            docker run --rm --pull=never "$image" /usr/bin/python3 -I -c \
              'import sys; assert sys.version_info[:2] == (3, 11)'
          }
          verify_shared "$SHARED_ARCHIVE_TAG"
          existing=$(inspect_remote "$version_tag")
          if [ "$existing" = absent ]; then
            docker image tag "$SHARED_ARCHIVE_TAG" "$version_tag"
            docker image push "$version_tag"
            digest=$(inspect_remote "$version_tag")
            test "$digest" != absent
          else
            digest=$existing
          fi
          docker image pull "$version_tag"
          verify_shared "$version_tag"
          reference="$GHCR_REPOSITORY@$digest"
          {
            echo "digest=$digest"
            echo "reference=$reference"
            echo "version-tag=$version_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Write shared publication registration
        env:
          SHARED_DIGEST: ${{ steps.publish.outputs.digest }}
          SHARED_INPUT_HASH: ${{ needs.shared-runtime.outputs.input-hash }}
          SHARED_REFERENCE: ${{ steps.publish.outputs.reference }}
          SHARED_REUSE_SOURCE: ${{ needs.shared-runtime.outputs.reuse-source }}
          SHARED_TAG: ${{ steps.publish.outputs.version-tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          record = {
              "digest": os.environ["SHARED_DIGEST"],
              "format_version": 2,
              "kind": "shared-runtime-publication",
              "reuse_source": os.environ["SHARED_REUSE_SOURCE"],
              "source_sha256": os.environ["SHARED_INPUT_HASH"],
              "uri": os.environ["SHARED_REFERENCE"],
              "version_tag": os.environ["SHARED_TAG"],
          }
          pathlib.Path("publication-shared.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload shared publication registration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-shared
          path: publication-shared.json
          if-no-files-found: error
          retention-days: 30

  publish-execution:
    name: Publish execution (${{ matrix.tool }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'publish-images' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [assemble-execution, publication-plan, publish-shared]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tool:
          - aws-cli
          - minio-mc
          - ps3
          - rclone
          - s3-fast-list
          - s3kor
          - s3p
          - s4cmd
          - s5cmd
          - s7cmd
          - swath
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download built tool image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tool-image-${{ matrix.tool }}
          path: image-artifacts

      - name: Download CI image registration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registration-${{ matrix.tool }}
          path: ci-registration

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Define versioned image tags
        env:
          CHANNEL_TAG_SUFFIX: ${{ needs.publication-plan.outputs.channel-tag-suffix }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          tool = os.environ["TOOL"]
          record = json.loads(pathlib.Path(f"ci-registration/{tool}.json").read_text())
          tool_version = record["tool_version"]
          tool_tag_version = record["tool_tag_version"]
          worker_version = record["worker_version"]
          worker_tag_version = record["worker_tag_version"]
          worker_revision = record["checkout_revision"]
          worker_source = record["worker_source_sha256"]
          shared_source = record["shared_base_source_sha256"]
          build_hash = record["tool_build_sha256"]

          if record["tool"] != tool:
              raise SystemExit("CI registration does not match the matrix entry")
          if any("\n" in value or "\r" in value for value in (tool_version, worker_version)):
              raise SystemExit("versions must be single-line strings")
          if not re.fullmatch(r"[a-z0-9_][a-z0-9._-]{0,63}", tool_tag_version):
              raise SystemExit("CI registration has an invalid canonical tool tag version")
          if not re.fullmatch(r"[a-z0-9_][a-z0-9._-]{0,63}", worker_tag_version):
              raise SystemExit("CI registration has an invalid canonical worker tag version")
          if not re.fullmatch(r"[0-9a-f]{64}", build_hash):
              raise SystemExit("tool build hash is not a sha256")
          for name, value in (
              ("shared source", shared_source),
              ("worker source", worker_source),
          ):
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(f"{name} hash is not a sha256")
          if not re.fullmatch(r"[0-9a-f]{40,64}", worker_revision):
              raise SystemExit("worker revision is not a Git object ID")

          repository = os.environ["GHCR_REPOSITORY"]
          tool_tag = (
              f"{repository}:tool-{tool}-v{tool_tag_version}"
              f"-base-{shared_source[:12]}-build-{build_hash[:12]}"
          )
          execution_tag = (
              f"{repository}:execution-{tool}-v{tool_tag_version}"
              f"-base-{shared_source[:12]}-build-{build_hash[:12]}"
              f"-worker-v{worker_tag_version}-src-{worker_source[:12]}"
          )
          channel_tag = f"{repository}:execution-{tool}-{os.environ['CHANNEL_TAG_SUFFIX']}"
          tag_pattern = re.compile(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}")
          for tag in (tool_tag, execution_tag, channel_tag):
              tag_name = tag.rsplit(":", 1)[1]
              if len(tag_name) > 128 or not tag_pattern.fullmatch(tag_name):
                  raise SystemExit(f"invalid Docker tag: {tag_name}")

          output = pathlib.Path(os.environ["GITHUB_ENV"])
          with output.open("a", encoding="utf-8") as stream:
              for key, value in {
                  "TOOL_VERSION": tool_version,
                  "WORKER_VERSION": worker_version,
                  "WORKER_REVISION": worker_revision,
                  "WORKER_SOURCE_SHA256": worker_source,
                  "SHARED_SOURCE_SHA256": shared_source,
                  "TOOL_BUILD_SHA256": build_hash,
                  "TOOL_VERSION_TAG": tool_tag,
                  "EXECUTION_VERSION_TAG": execution_tag,
                  "EXECUTION_CHANNEL_TAG": channel_tag,
              }.items():
                  print(f"{key}={value}", file=stream)
          PY

      - name: Publish tool parent and thin execution image
        id: publish
        env:
          SHARED_DIGEST: ${{ needs.publish-shared.outputs.digest }}
          SHARED_REFERENCE: ${{ needs.publish-shared.outputs.reference }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          inspect_remote() {
            local tag=$1 output error remote
            output=$(mktemp)
            error=$(mktemp)
            if docker buildx imagetools inspect "$tag" >"$output" 2>"$error"; then
              remote=$(sed -n 's/^Digest:[[:space:]]*//p' "$output" | head -n 1)
              [[ "$remote" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              printf '%s\n' "$remote"
            elif grep -Eqi 'manifest unknown|not found' "$error"; then
              printf '%s\n' absent
            else
              cat "$error" >&2
              return 1
            fi
          }
          guarded_push() {
            local local_tag=$1 version_tag=$2 existing published
            docker image tag "$local_tag" "$version_tag"
            existing=$(inspect_remote "$version_tag")
            if [ "$existing" = absent ]; then
              docker image push "$version_tag" >&2
              published=$(inspect_remote "$version_tag")
              test "$published" != absent
              printf '%s\n' "$published"
            else
              echo "refusing to overwrite unexpectedly-created $version_tag ($existing)" >&2
              return 1
            fi
          }
          verify_execution() {
            local image=$1
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
            test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")" = \
              '["/usr/bin/python3","-I","/opt/s3-listing-study/attempt.pyz"]'
            docker run --rm --pull=never --entrypoint /usr/bin/python3 "$image" \
              -I -c 'import json,sys; p=json.load(open("/opt/s3-listing-study/image-provenance.json")); assert p["schema_version"] == 2; assert p["tool_image"]["uri"] == sys.argv[1]; assert p["worker_source_sha256"] == sys.argv[2]' \
              "$tool_reference" "$WORKER_SOURCE_SHA256"
          }

          gunzip -c "image-artifacts/$TOOL-tool.tar.gz" | docker image load
          local_tool_tag="$LOCAL_REGISTRY/tool/$TOOL:ci"
          verify_tool() {
            local image=$1
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
            test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.tool-build-sha256"}}' "$image")" = "$TOOL_BUILD_SHA256"
            test "$(docker run --rm --pull=never "$image" cat /opt/s3-listing-study/shared-base-source.sha256)" = "$SHARED_SOURCE_SHA256"
          }
          verify_tool "$local_tool_tag"
          existing_tool=$(inspect_remote "$TOOL_VERSION_TAG")
          if [ "$existing_tool" = absent ]; then
            docker image tag "$local_tool_tag" "$TOOL_VERSION_TAG"
            docker image push "$TOOL_VERSION_TAG"
            tool_digest=$(inspect_remote "$TOOL_VERSION_TAG")
          else
            tool_digest=$existing_tool
          fi
          docker image pull "$TOOL_VERSION_TAG"
          verify_tool "$TOOL_VERSION_TAG"
          tool_reference="$GHCR_REPOSITORY@$tool_digest"

          existing_execution=$(inspect_remote "$EXECUTION_VERSION_TAG")
          if [ "$existing_execution" != absent ]; then
            docker image pull "$EXECUTION_VERSION_TAG"
            verify_execution "$EXECUTION_VERSION_TAG"
            execution_digest=$existing_execution
            execution_reuse_source=ghcr
          else
            execution_candidate="s3-listing-study/execution/$TOOL:candidate"
            uv run s3-listing-study build-derived-image \
              --tool "$TOOL" --tool-image "$tool_reference" --tag "$execution_candidate"
            verify_execution "$execution_candidate"
            execution_digest=$(guarded_push "$execution_candidate" "$EXECUTION_VERSION_TAG")
            docker image pull "$EXECUTION_VERSION_TAG"
            verify_execution "$EXECUTION_VERSION_TAG"
            execution_reuse_source=rebuilt
          fi
          execution_reference="$GHCR_REPOSITORY@$execution_digest"
          printf '%s\n' \
            "TOOL_REFERENCE=$tool_reference" \
            "TOOL_DIGEST=$tool_digest" \
            "EXECUTION_REFERENCE=$execution_reference" \
            "EXECUTION_DIGEST=$execution_digest" \
            "EXECUTION_REUSE_SOURCE=$execution_reuse_source" >> "$GITHUB_ENV"

      - name: Verify baked GHCR provenance
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$EXECUTION_VERSION_TAG")" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "io.varve.s3-listing-study.worker-source-sha256"}}' "$EXECUTION_VERSION_TAG")" = "$WORKER_SOURCE_SHA256"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$EXECUTION_VERSION_TAG")" = \
            '["/usr/bin/python3","-I","/opt/s3-listing-study/attempt.pyz"]'
          docker run --rm --pull=never --entrypoint /usr/bin/python3 "$EXECUTION_VERSION_TAG" \
            -I -c 'import json,sys; p=json.load(open("/opt/s3-listing-study/image-provenance.json")); assert p["schema_version"] == 2; assert p["tool_image"]["uri"] == sys.argv[1]; assert p["worker_source_sha256"] == sys.argv[2]' \
            "$TOOL_REFERENCE" "$WORKER_SOURCE_SHA256"

      - name: Write tool publication registration
        env:
          CHANNEL_TAG_SUFFIX: ${{ needs.publication-plan.outputs.channel-tag-suffix }}
          SHARED_DIGEST: ${{ needs.publish-shared.outputs.digest }}
          SHARED_REFERENCE: ${{ needs.publish-shared.outputs.reference }}
          SHARED_VERSION_TAG: ${{ needs.publish-shared.outputs.version-tag }}
          TOOL: ${{ matrix.tool }}
        run: |
          mkdir -p publications
          python3 - "$TOOL" <<'PY'
          import json
          import os
          import pathlib
          import sys

          tool = sys.argv[1]
          ci = json.loads(pathlib.Path(f"ci-registration/{tool}.json").read_text())
          record = {
              "channel_tag_suffix": os.environ["CHANNEL_TAG_SUFFIX"],
              "checkout_revision": ci["checkout_revision"],
              "format_version": 2,
              "kind": "tool-execution-publication",
              "execution": {
                  "channel_tag": os.environ["EXECUTION_CHANNEL_TAG"],
                  "digest": os.environ["EXECUTION_DIGEST"],
                  "reuse_source": os.environ["EXECUTION_REUSE_SOURCE"],
                  "uri": os.environ["EXECUTION_REFERENCE"],
                  "version_tag": os.environ["EXECUTION_VERSION_TAG"],
              },
              "selection_sha256": ci["selection_sha256"],
              "shared": {
                  "digest": os.environ["SHARED_DIGEST"],
                  "reuse_source": ci["shared_reuse_source"],
                  "source_sha256": ci["shared_base_source_sha256"],
                  "uri": os.environ["SHARED_REFERENCE"],
                  "version_tag": os.environ["SHARED_VERSION_TAG"],
              },
              "tool": {
                  "build_sha256": ci["tool_build_sha256"],
                  "digest": os.environ["TOOL_DIGEST"],
                  "reuse_source": ci["tool_reuse_source"],
                  "uri": os.environ["TOOL_REFERENCE"],
                  "version_tag": os.environ["TOOL_VERSION_TAG"],
              },
              "tool_name": tool,
              "tool_version": os.environ["TOOL_VERSION"],
              "pull_request": ci["pull_request"],
              "worker_revision": os.environ["WORKER_REVISION"],
              "worker_source_sha256": os.environ["WORKER_SOURCE_SHA256"],
              "worker_version": os.environ["WORKER_VERSION"],
          }
          pathlib.Path(f"publications/{tool}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload tool publication registration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.tool }}
          path: publications/${{ matrix.tool }}.json
          if-no-files-found: error
          retention-days: 30

  publication-summary:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_ghcr) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'publish-images' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [publication-plan, publish-shared, publish-execution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      publication-set-digest: ${{ steps.ledger.outputs.digest }}
      publication-set-reference: ${{ steps.ledger.outputs.reference }}
      publication-set-version-tag: ${{ steps.ledger.outputs.version-tag }}
    steps:
      - name: Download publication registrations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publication-*
          path: publications

      - name: Assemble and validate GHCR publication manifest
        env:
          CHANNEL_TAG_SUFFIX: ${{ needs.publication-plan.outputs.channel-tag-suffix }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          expected = {
              "aws-cli", "minio-mc", "ps3", "rclone", "s3-fast-list", "s3kor",
              "s3p", "s4cmd", "s5cmd", "s7cmd", "swath",
          }
          paths = list(pathlib.Path("publications").glob("**/*.json"))
          records = [json.loads(path.read_text()) for path in paths if path.name != "publication-shared.json"]
          shared_paths = [path for path in paths if path.name == "publication-shared.json"]
          by_tool = {record["tool_name"]: record for record in records}
          if len(records) != len(by_tool) or set(by_tool) != expected:
              raise SystemExit("GHCR publication registrations are missing, duplicated, or unexpected")
          if len(shared_paths) != 1:
              raise SystemExit("shared publication registration is missing or duplicated")
          shared = json.loads(shared_paths[0].read_text())
          shared_identity = (
              shared["uri"],
              shared["digest"],
              shared["version_tag"],
              shared["source_sha256"],
              shared["reuse_source"],
          )
          if any(
              (
                  record["shared"]["uri"],
                  record["shared"]["digest"],
                  record["shared"]["version_tag"],
                  record["shared"]["source_sha256"],
                  record["shared"]["reuse_source"],
              )
              != shared_identity
              for record in records
          ):
              raise SystemExit("tool publications do not share the published runtime")
          if any(
              record.get("kind") != "tool-execution-publication"
              or record.get("format_version") != 2
              for record in records
          ):
              raise SystemExit("tool publication registrations do not use format 2")
          if (
              shared.get("kind") != "shared-runtime-publication"
              or shared.get("format_version") != 2
          ):
              raise SystemExit("shared publication registration does not use format 2")
          if any(record["channel_tag_suffix"] != os.environ["CHANNEL_TAG_SUFFIX"] for record in records):
              raise SystemExit("tool publications do not share the selected channel tag")
          pull_request = (
              {
                  "base_sha": os.environ["PR_BASE_SHA"],
                  "head_sha": os.environ["PR_HEAD_SHA"],
                  "number": int(os.environ["PR_NUMBER"]),
              }
              if os.environ["PR_NUMBER"]
              else None
          )
          if any(record["pull_request"] != pull_request for record in records):
              raise SystemExit("tool publications do not share pull-request identity")
          if any(record["checkout_revision"] != os.environ["GITHUB_SHA"] for record in records):
              raise SystemExit("tool publications do not share checkout revision")
          document = {
              "channel_tag_suffix": os.environ["CHANNEL_TAG_SUFFIX"],
              "checkout_revision": os.environ["GITHUB_SHA"],
              "images": by_tool,
              "format_version": 2,
              "kind": "github-container-image-publication",
              "repository": os.environ["GHCR_REPOSITORY"],
              "pull_request": pull_request,
              "shared": shared,
              "source_ref": os.environ["GITHUB_REF"],
          }
          pathlib.Path("ghcr-publication-manifest.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      # This artifact is written before any movable tag changes. The OCI ledger
      # below remains authoritative after Actions artifact expiry.
      - name: Upload aggregate GHCR publication manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-publication-manifest
          path: ghcr-publication-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable publication-set ledger
        id: ledger
        env:
          CHANNEL_TAG_SUFFIX: ${{ needs.publication-plan.outputs.channel-tag-suffix }}
        run: |
          set -euo pipefail
          inspect_remote() {
            local tag=$1 output error remote
            output=$(mktemp)
            error=$(mktemp)
            if docker buildx imagetools inspect "$tag" >"$output" 2>"$error"; then
              remote=$(sed -n 's/^Digest:[[:space:]]*//p' "$output" | head -n 1)
              [[ "$remote" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              printf '%s\n' "$remote"
            elif grep -Eqi 'manifest unknown|not found' "$error"; then
              printf '%s\n' absent
            else
              cat "$error" >&2
              return 1
            fi
          }
          manifest_sha=$(sha256sum ghcr-publication-manifest.json | cut -d' ' -f1)
          version_tag="$GHCR_REPOSITORY:set-v2-${manifest_sha:0:12}"
          channel_tag="$GHCR_REPOSITORY:set-$CHANNEL_TAG_SUFFIX"
          existing=$(inspect_remote "$version_tag")
          if [ "$existing" != absent ]; then
            docker image pull "$version_tag"
            docker create --name publication-set-check "$version_tag" /manifest.json >/dev/null
            docker cp publication-set-check:/manifest.json existing-manifest.json
            cmp ghcr-publication-manifest.json existing-manifest.json
            test "$(sha256sum existing-manifest.json | cut -d' ' -f1)" = "$manifest_sha"
            docker container rm publication-set-check >/dev/null
            digest=$existing
          else
            candidate="s3-listing-study/publication-set:candidate"
            touch -d '1980-01-01 00:00:00 UTC' ghcr-publication-manifest.json
            docker build --file - --tag "$candidate" . <<'DOCKERFILE'
          FROM scratch
          COPY ghcr-publication-manifest.json /manifest.json
          DOCKERFILE
            docker image tag "$candidate" "$version_tag"
            docker image push "$version_tag"
            digest=$(inspect_remote "$version_tag")
            test "$digest" != absent
            docker image pull "$version_tag"
            docker create --name publication-set-check "$version_tag" /manifest.json >/dev/null
            docker cp publication-set-check:/manifest.json existing-manifest.json
            cmp ghcr-publication-manifest.json existing-manifest.json
            test "$(sha256sum existing-manifest.json | cut -d' ' -f1)" = "$manifest_sha"
            docker container rm publication-set-check >/dev/null
          fi
          {
            echo "digest=$digest"
            echo "reference=$GHCR_REPOSITORY@$digest"
            echo "version-tag=$version_tag"
            echo "channel-tag=$channel_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Record pre-promotion channel state
        env:
          SET_CHANNEL_TAG: ${{ steps.ledger.outputs.channel-tag }}
          SET_DIGEST: ${{ steps.ledger.outputs.digest }}
          SET_REFERENCE: ${{ steps.ledger.outputs.reference }}
          SET_VERSION_TAG: ${{ steps.ledger.outputs.version-tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > channel-tags.tsv
          import json
          import pathlib

          for path in sorted(pathlib.Path("publications").glob("**/*.json")):
              if path.name == "publication-shared.json":
                  continue
              record = json.loads(path.read_text())
              image = record["execution"]
              print(record["tool_name"], image["uri"], image["channel_tag"], sep="\t")
          PY
          test "$(wc -l < channel-tags.tsv)" -eq 11
          inspect_remote() {
            local tag=$1 output error remote
            output=$(mktemp)
            error=$(mktemp)
            if docker buildx imagetools inspect "$tag" >"$output" 2>"$error"; then
              remote=$(sed -n 's/^Digest:[[:space:]]*//p' "$output" | head -n 1)
              [[ "$remote" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
              printf '%s\n' "$remote"
            elif grep -Eqi 'manifest unknown|not found' "$error"; then
              printf '%s\n' absent
            else
              cat "$error" >&2
              return 1
            fi
          }
          : > channel-promotion-plan.tsv
          while IFS=$'\t' read -r tool reference channel_tag; do
            previous=$(inspect_remote "$channel_tag")
            printf '%s\t%s\t%s\t%s\n' \
              "$tool" "$reference" "$channel_tag" "$previous" \
              >> channel-promotion-plan.tsv
          done < channel-tags.tsv
          test "$(wc -l < channel-promotion-plan.tsv)" -eq 11
          set_previous=$(inspect_remote "$SET_CHANNEL_TAG")
          python3 - "$set_previous" <<'PY'
          import json
          import os
          import pathlib
          import sys

          channels = {}
          for line in pathlib.Path("channel-promotion-plan.tsv").read_text().splitlines():
              tool, reference, tag, previous = line.split("\t")
              channels[tool] = {
                  "channel_tag": tag,
                  "intended_digest": reference.rsplit("@", 1)[1],
                  "previous_digest": previous,
                  "status": "planned",
              }
          report = {
              "checkout_revision": os.environ["GITHUB_SHA"],
              "execution_channels": channels,
              "format_version": 1,
              "kind": "github-container-image-promotion-report",
              "publication_set": {
                  "channel_tag": os.environ["SET_CHANNEL_TAG"],
                  "intended_digest": os.environ["SET_DIGEST"],
                  "previous_digest": sys.argv[1],
                  "reference": os.environ["SET_REFERENCE"],
                  "status": "planned",
                  "version_tag": os.environ["SET_VERSION_TAG"],
              },
          }
          pathlib.Path("promotion-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              print("## GHCR channel promotion plan", file=stream)
              print("", file=stream)
              print("| Channel | Previous | Intended |", file=stream)
              print("| --- | --- | --- |", file=stream)
              for entry in channels.values():
                  print(
                      f"| `{entry['channel_tag']}` | `{entry['previous_digest']}` | "
                      f"`{entry['intended_digest']}` |",
                      file=stream,
                  )
              publication_set = report["publication_set"]
              print(
                  f"| `{publication_set['channel_tag']}` | "
                  f"`{publication_set['previous_digest']}` | "
                  f"`{publication_set['intended_digest']}` |",
                  file=stream,
              )
          PY

      - name: Promote the validated execution channels
        run: |
          set -euo pipefail
          promoted_count=0
          while IFS=$'\t' read -r tool reference channel_tag _previous; do
            docker buildx imagetools create \
              --prefer-index=false \
              --metadata-file promotion-metadata.json \
              --tag "$channel_tag" \
              "$reference" < /dev/null
            promoted_digest=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.descriptor"]["digest"])' \
              promotion-metadata.json)
            test "$promoted_digest" = "${reference##*@}"
            python3 - "$tool" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path("promotion-report.json")
          report = json.loads(path.read_text())
          report["execution_channels"][sys.argv[1]]["status"] = "promoted"
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              print(f"- Promoted execution channel for `{sys.argv[1]}`", file=stream)
          PY
            promoted_count=$((promoted_count + 1))
          done < channel-promotion-plan.tsv
          test "$promoted_count" -eq 11

      - name: Advance publication-set readiness channel last
        env:
          SET_CHANNEL_TAG: ${{ steps.ledger.outputs.channel-tag }}
          SET_DIGEST: ${{ steps.ledger.outputs.digest }}
          SET_REFERENCE: ${{ steps.ledger.outputs.reference }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file set-promotion-metadata.json \
            --tag "$SET_CHANNEL_TAG" \
            "$SET_REFERENCE"
          promoted_digest=$(python3 -c \
            'import json; print(json.load(open("set-promotion-metadata.json"))["containerimage.descriptor"]["digest"])')
          test "$promoted_digest" = "$SET_DIGEST"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("promotion-report.json")
          report = json.loads(path.read_text())
          report["publication_set"]["status"] = "promoted"
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              print("- Advanced the authoritative publication-set channel", file=stream)
          PY

      - name: Upload channel promotion report
        if: always() && hashFiles('promotion-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-promotion-report
          path: promotion-report.json
          if-no-files-found: error
          retention-days: 30
