[project]
name = "s3-listing-snakemake-trial"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "s3-listing-study",
    "snakemake==9.25.1",
    "snakemake-executor-plugin-googlebatch==0.5.1",
    "snakemake-storage-plugin-gcs==1.1.4",
]

[tool.uv.sources]
s3-listing-study = { path = "../../..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snakemake_executor_plugin_googlebatch_study"]
