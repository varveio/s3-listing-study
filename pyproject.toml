[project]
name = "s3-listing-study"
version = "0.1.0"
description = "Object-store listing tool study: contract, registry, manifest, and verifier."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "duckdb>=1.1",
    # tools/aws-cli/adapter/normalize.sh (s3api-v2-yamlstream) shells out to
    # `python3 -c 'import yaml'`. Declared here so `uv run` replays the corpus
    # the same way a bare `python3` does; the oracle preflight also refuses to
    # judge without it rather than reporting a missing import as a port bug.
    "pyyaml>=6.0",
]

[project.scripts]
s3-listing-study = "s3_listing_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_listing_study"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# scripts/ predates this package and is ported into src/s3_listing_study by a
# later unit; it is not linted here until then.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["s3_listing_study"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
