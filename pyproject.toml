[project]
name = "s3-listing-study"
version = "0.1.0"
description = "Object-store listing tool study: contract, registry, manifest, and verifier."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "duckdb>=1.1",
    # s3_listing_study.capsule validates tool.json/claims.json against the
    # Draft 2020-12 schemas in schemas/; the capsule gate is a real dependency
    # of this package, not something the CI runner provisions on the side.
    "jsonschema>=4.23",
    # tools/aws-cli/adapter/normalize.py imports yaml for s3api-v2-yamlstream.
    # Declared here so `uv run` replays the corpus
    # the same way a bare `python3` does; the oracle preflight also refuses to
    # judge without it rather than reporting a missing import as a port bug.
    "pyyaml>=6.0",
    # s3_listing_study.upload only. Not a dependency of the attempt engine or
    # anything in the timed/security-critical path — the uploader is a
    # deliberately separate process (see harness/README.md and the campaign
    # orchestration notes: no gcsfuse, nothing GCS-shaped inside the engine).
    # Used for its if_generation_match=0 create-only semantics, which is what
    # makes "an attempt is never overwritten" enforceable on upload, not just
    # documented.
    "google-cloud-storage>=2.18",
]

[project.scripts]
s3-listing-study = "s3_listing_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # The capsule gate's only third-party import. Stubs rather than an
    # ignore_missing_imports override: the validator's schema calls are worth
    # type-checking.
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_listing_study"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["s3_listing_study"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# `oracle` marks a test that reads the reference data in $S3_STUDY_DATA. That
# data is deliberately not in the repo, so CI deselects the marker rather than
# letting the test self-skip: a gate that cannot run must say so where it is
# configured, not quietly report a pass. Run them locally with `-m oracle`.
markers = ["oracle: needs the reference data in $S3_STUDY_DATA"]
