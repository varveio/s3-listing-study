[project]
name = "s3-listing-study"
version = "0.1.0"
description = "Object-store listing tool research and comparative benchmark harness."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "duckdb>=1.1",
    # AWS's buffered JSON output is counted incrementally after timing. Require
    # ijson's compiled YAJL backend so this cannot silently fall back to Python.
    # The benchmark controller uses Google's official clients for exact Batch
    # protobuf comparison and bounded GCS reads. Subject build stages remain
    # isolated; these SDKs enter only the final toolbox harness runtime.
    "google-cloud-batch>=0.17.36",
    "google-cloud-storage>=2.18",
    "ijson==3.5.1",
    # s3_listing_study.repo.capsule validates tool.json/claims.json against the
    # Draft 2020-12 schemas in schemas/; the capsule gate is a real dependency
    # of this package, not something the CI runner provisions on the side.
    "jsonschema>=4.23",
    # tools/aws-cli/adapter/normalize.py imports yaml for s3api-v2-yamlstream.
    # Declared here so `uv run` replays the corpus
    # the same way a bare `python3` does; the oracle preflight also refuses to
    # judge without it rather than reporting a missing import as a port bug.
    "pyyaml>=6.0",
]

[project.scripts]
s3-listing-study = "s3_listing_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # The capsule gate's only third-party import. Stubs rather than an
    # ignore_missing_imports override: the validator's schema calls are worth
    # type-checking.
    "types-jsonschema>=4.23",
    # Same reasoning for the bucket-plan reader: a plan is hand-written config,
    # so the shape it comes back as is worth type-checking.
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_listing_study", "benchmark/src/benchmark"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["benchmark/src", "src", "benchmark/tests", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["benchmark", "s3_listing_study"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["benchmark/src", "benchmark/tests", "src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ijson.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["benchmark/tests", "tests"]
addopts = "-ra"
