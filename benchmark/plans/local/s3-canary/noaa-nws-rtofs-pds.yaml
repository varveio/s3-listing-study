# One serial real-S3 qualification attempt for every capsule in the toolbox.
#
# This is deliberately a canary, not a benchmark: no timing from this one-run
# mutable-bucket pass is comparative evidence. Its jobs establish that each
# capsule, including the explicitly retired s4cmd exception, can enter through
# the current worker and leave bound local evidence. The local runner replaces
# the shared s4cmd exclusion only when its narrow override flag is present.

spec_version: 2

bucket: noaa-nws-rtofs-pds
region: us-east-1
auth_role: public-read

defaults:
  reps: 1
  timeout_s: 1800
  vcpus: 2
  memory_gb: 4
  container_memory_gb: 4

tools:
  aws-cli:
    cases:
      - {purpose: canary}
  minio-mc:
    cases:
      - {purpose: canary}
  ps3:
    cases:
      - {purpose: canary}
  rclone:
    cases:
      - {purpose: canary}
  s3-fast-list:
    cases:
      - {purpose: canary}
  s4cmd:
    cases:
      - {purpose: canary}
  s3kor:
    cases:
      - {purpose: canary}
  s3p:
    cases:
      - {purpose: canary}
  s5cmd:
    cases:
      - {purpose: canary}
  s7cmd:
    cases:
      - {purpose: canary}
  swath:
    cases:
      - {purpose: canary}
