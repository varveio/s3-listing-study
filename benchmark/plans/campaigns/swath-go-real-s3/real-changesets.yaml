# Swath (Go port) sorted dataset against live S3, unsigned. No replay block.
# A small live check of the flat bucket whose Java capture is the replay fixture of
# campaigns/real-changesets-replay/flat; submit with --boot-disk-gb 200.
spec_version: 2

bucket: real-changesets
region: us-west-2
auth_role: public-read

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 32
  memory_gb: 64

tools:
  swath-go:
    cases:
      - mode: recursive-parquet-sorted
        concurrency: 64
        purpose: diagnostic
        config: {max_duration: 7170s}

exclude:
  - {tool: aws-cli, reason: outside this Go-port real-S3 diagnostic}
  - {tool: minio-mc, reason: outside this Go-port real-S3 diagnostic}
  - {tool: ps3, reason: outside this Go-port real-S3 diagnostic}
  - {tool: rclone, reason: outside this Go-port real-S3 diagnostic}
  - {tool: s3-fast-list, reason: outside this Go-port real-S3 diagnostic}
  - {tool: s3kor, reason: outside this Go-port real-S3 diagnostic}
  - {tool: s3p, reason: outside this Go-port real-S3 diagnostic}
  - {tool: s5cmd, reason: outside this Go-port real-S3 diagnostic}
  - {tool: s7cmd, reason: outside this Go-port real-S3 diagnostic}
  - {tool: swath, reason: outside this Go-port real-S3 diagnostic}
