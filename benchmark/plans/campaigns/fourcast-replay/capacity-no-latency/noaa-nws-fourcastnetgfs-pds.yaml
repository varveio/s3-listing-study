# Replay capacity diagnostic over the 4,081,170-row FourCastNet GFS fixture.
# No injection deliberately maximizes demand on the colocated replay server;
# these rows qualify capacity and produce no comparative measurement.
spec_version: 3

bucket: noaa-nws-fourcastnetgfs-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nws-fourcastnetgfs-pds/1b8be9d08d1006a5dc15dd0f190862c3871d664d3a8b68b4f7d2ddd7be8b0ad4/part-00000.parquet
  fixture_sha256: 1b8be9d08d1006a5dc15dd0f190862c3871d664d3a8b68b4f7d2ddd7be8b0ad4
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 1800
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 6
  container_memory_gb: 16
  replay_vcpus: 8
  replay_memory_gb: 8
  replay_parquet_connections: 32
  replay_max_concurrent_requests: 4096
  replay_prefetch: true
  replay_prefetch_max_windows: 256
  replay_heap_percent: 75

tools:
  ps3:
    cases:
      - {mode: list, purpose: diagnostic}
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 64, purpose: diagnostic}

exclude:
  - {tool: aws-cli, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: minio-mc, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: rclone, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: s3-fast-list, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: s3kor, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: s3p, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: s5cmd, reason: capacity diagnostic uses the widest-demand representative clients}
  - {tool: s7cmd, reason: capacity diagnostic uses the widest-demand representative clients}
