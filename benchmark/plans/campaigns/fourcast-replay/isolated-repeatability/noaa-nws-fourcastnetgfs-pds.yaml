# Five-repeat fast-cell control under the topology-aware N4 allocation. This
# estimates within-treatment dispersion without using the changed first and
# second full passes as a noise sample.
spec_version: 3

bucket: noaa-nws-fourcastnetgfs-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:3955f242f25294d3ebc6d63d3cf23e2a2694f7f1c9a5334dc6ec1054b0a69097
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nws-fourcastnetgfs-pds/current-eba31d9/part-00000.parquet
  fixture_sha256: abc259e0e2e956f096c6aa0dc5e3532c608a4df4675e165a6560ae6d868374e2
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 85
      pivot_probe: 35
      structure_probe: 37
    scale: 1.0
    jitter: none

defaults:
  reps: 5
  timeout_s: 1800
  vcpus: 32
  memory_gb: 64
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 16
  replay_memory_gb: 16
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 4096
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  rclone:
    cases:
      - {mode: recursive-walk, concurrency: 32, purpose: diagnostic}

  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: not a repeatability control}
  - {tool: minio-mc, reason: not a repeatability control}
  - {tool: ps3, reason: not a repeatability control}
  - {tool: s3-fast-list, reason: its three-repeat isolated ladder estimates its own dispersion}
  - {tool: s3kor, reason: not a repeatability control}
  - {tool: s3p, reason: not a repeatability control}
  - {tool: s5cmd, reason: not a repeatability control}
  - {tool: s7cmd, reason: not a repeatability control}
