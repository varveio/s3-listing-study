# First cloud CPU-response screen: one selected mode per active tool at 2, 4,
# and 8 subject vCPU. One observation per cell initially; repeat only ambiguous
# or invalid cells. Replay remains diagnostic and every attempt retains its
# native product, row count, subject metrics, and replay evidence.
spec_version: 3

bucket: noaa-nws-fourcastnetgfs-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/swath-replay@sha256:ace5350d99c217bf5919b795fc53ed955d1dc2fb6bef1eecf36e8a90e9732f07
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nws-fourcastnetgfs-pds/1b8be9d08d1006a5dc15dd0f190862c3871d664d3a8b68b4f7d2ddd7be8b0ad4/part-00000.parquet
  fixture_sha256: 1b8be9d08d1006a5dc15dd0f190862c3871d664d3a8b68b4f7d2ddd7be8b0ad4
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 85
      pivot_probe: 35
      structure_probe: 37
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 1800
  vcpus: 8
  memory_gb: 16
  container_memory_gb: 8
  subject_vcpus: 2
  replay_vcpus: 4
  replay_memory_gb: 4
  replay_parquet_connections: 16
  replay_max_concurrent_requests: 4096
  replay_prefetch: true
  replay_prefetch_max_windows: 256
  replay_heap_percent: 75

# The three literal rows per tool are the same allocation tiers:
# low:    n4-highcpu-8,  subject 2c/8g, replay 4c/4g, host 2c/4g
# middle: n4-highcpu-8,  subject 4c/8g, replay 2c/4g, host 2c/4g
# high:   n4-highcpu-16, subject 8c/8g, replay 6c/8g, host 2c/16g
# Mode and concurrency stay fixed inside each tool so subject CPU is the axis.
tools:
  aws-cli:
    cases:
      - {mode: s3api-v2-text, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: s3api-v2-text, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: s3api-v2-text, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  minio-mc:
    cases:
      - {mode: recursive, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: recursive, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: recursive, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  ps3:
    cases:
      - {mode: list, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: list, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: list, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  rclone:
    cases:
      - {mode: recursive-walk, concurrency: 32, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: recursive-walk, concurrency: 32, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: recursive-walk, concurrency: 32, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  s3-fast-list:
    cases:
      - {mode: list-hinted, concurrency: 100, segments: 1000, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: list-hinted, concurrency: 100, segments: 1000, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: list-hinted, concurrency: 100, segments: 1000, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  s3kor:
    cases:
      - {mode: list, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: list, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: list, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  s3p:
    cases:
      - {mode: ls, concurrency: 100, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: ls, concurrency: 100, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: ls, concurrency: 100, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  s5cmd:
    cases:
      - {mode: recursive-with-dirs, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: recursive-with-dirs, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: recursive-with-dirs, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  s7cmd:
    cases:
      - {mode: recursive-one-nosort, concurrency: 64, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 2, replay_vcpus: 4, replay_memory_gb: 4}
      - {mode: recursive-one-nosort, concurrency: 64, purpose: diagnostic, vcpus: 8, memory_gb: 16, subject_vcpus: 4, replay_vcpus: 2, replay_memory_gb: 4}
      - {mode: recursive-one-nosort, concurrency: 64, purpose: diagnostic, vcpus: 16, memory_gb: 32, subject_vcpus: 8, replay_vcpus: 6, replay_memory_gb: 8}

  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        vcpus: 8
        memory_gb: 16
        subject_vcpus: 2
        replay_vcpus: 4
        replay_memory_gb: 4
        config: &swath_tsv
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        vcpus: 8
        memory_gb: 16
        subject_vcpus: 4
        replay_vcpus: 2
        replay_memory_gb: 4
        config: *swath_tsv
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        vcpus: 16
        memory_gb: 32
        subject_vcpus: 8
        replay_vcpus: 6
        replay_memory_gb: 8
        config: *swath_tsv
