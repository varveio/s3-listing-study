# Focused Swath c16/c64 transfer check on the larger SOREL fixture. This is not
# the deferred full-roster SOREL plan; it tests whether FourCast's fast/flat
# Swath curve was fixture-limited.
spec_version: 3

bucket: sorel-20m
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:992ef65f1d8e92385a39dfe0eea487ceeeaefd4ca186cd8511447317872ade1d
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/sorel-20m/current-eba31d9/part-*.parquet
  fixture_sha256: e17191c5213316db2733a32239c8b5e79f7e6ce4e067ed618911c412ce2b2bd1
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 126
      pivot_probe: 88
      structure_probe: 88
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 1800
  vcpus: 16
  memory_gb: 32
  container_memory_gb: 8
  subject_vcpus: 2
  replay_vcpus: 8
  replay_memory_gb: 8
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 4096
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        subject_vcpus: 2
        config: &swath_tsv
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        subject_vcpus: 4
        config: *swath_tsv
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        vcpus: 32
        memory_gb: 64
        subject_vcpus: 8
        replay_vcpus: 16
        replay_memory_gb: 16
        config: *swath_tsv
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        subject_vcpus: 2
        config: *swath_tsv
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        subject_vcpus: 4
        config: *swath_tsv
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        vcpus: 32
        memory_gb: 64
        subject_vcpus: 8
        replay_vcpus: 16
        replay_memory_gb: 16
        config: *swath_tsv

exclude:
  - {tool: aws-cli, reason: focused Swath transfer check}
  - {tool: minio-mc, reason: focused Swath transfer check}
  - {tool: ps3, reason: focused Swath transfer check}
  - {tool: rclone, reason: focused Swath transfer check}
  - {tool: s3-fast-list, reason: focused Swath transfer check}
  - {tool: s3kor, reason: focused Swath transfer check}
  - {tool: s3p, reason: focused Swath transfer check}
  - {tool: s5cmd, reason: focused Swath transfer check}
  - {tool: s7cmd, reason: focused Swath transfer check}
