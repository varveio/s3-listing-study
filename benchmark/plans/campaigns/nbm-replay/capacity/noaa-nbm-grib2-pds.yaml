# First capacity screen on the 66.4M-object NBM fixture. One best-studied
# 8-vCPU arm per survivor; no CPU ladder until each path proves it can finish.
# s3-fast-list consumes the fixture bundle's fixed precomputed hints companion,
# so this launch has no serial bootstrap preparation or dependency slot.
spec_version: 3

bucket: noaa-nbm-grib2-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:e63da67a02b3f5e9a7bb78621bca74b157b6a86acbce30af5f2d650a44aa27c5
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nbm-grib2-pds/current-eba31d9/part-*.parquet
  fixture_sha256: de7e0487fe7237590b421299853ff7f88f27a006f5d8528ece23f3be26a2624a
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 87
      pivot_probe: 37
      structure_probe: 51
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 32
  memory_gb: 64
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 20
  replay_memory_gb: 20
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 512
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  rclone:
    cases:
      - {mode: recursive-walk, concurrency: 64, purpose: diagnostic}

  s3-fast-list:
    cases:
      - mode: list-hinted-fixture
        concurrency: 100
        segments: 1000
        purpose: diagnostic
        config: {hints_file_sha256: b76e134db51e799c846130c6f8ec6ab2181d8ac5238bfbca1381ff6ba45fcba6}
      - mode: list-hinted-fixture
        concurrency: 100
        segments: 1000
        purpose: diagnostic
        container_memory_gb: 16
        config: {hints_file_sha256: b76e134db51e799c846130c6f8ec6ab2181d8ac5238bfbca1381ff6ba45fcba6}

  s3p:
    cases:
      - {mode: ls, concurrency: 16, purpose: diagnostic}

  s5cmd:
    cases:
      - mode: fanout-with-dirs
        concurrency: 8
        purpose: diagnostic
        config:
          shard_prefixes: blend.2020,blend.2021,blend.2022,blend.2023,blend.2024,blend.2025,blend.2026,index.html
      - mode: fanout-fixture-with-dirs
        concurrency: 64
        purpose: diagnostic
        config:
          shard_file_sha256: 38d9fcdb353f2ea3d6acf90eb01218dba7a50e3122fcc5bfc7632aa94162f98b

  s7cmd:
    cases:
      - mode: recursive-one-nosort
        concurrency: 16
        purpose: diagnostic
        config: {parallel_depth: 1}
      - mode: recursive-one-nosort
        concurrency: 4
        purpose: diagnostic
        config: {parallel_depth: 1}
      - mode: recursive-one-nosort
        concurrency: 16
        purpose: diagnostic
        config: {aws_max_attempts: 1, parallel_depth: 1}

  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: stopped after FourCast}
  - {tool: minio-mc, reason: stopped after FourCast}
  - {tool: ps3, reason: stopped after FourCast}
  - {tool: s3kor, reason: stopped after FourCast}
