# First capacity screen on the 66.4M-object NBM fixture. One best-studied
# 8-vCPU arm per survivor; no CPU ladder until each path proves it can finish.
# s3-fast-list consumes the fixture bundle's fixed precomputed hints companion,
# so this launch has no serial bootstrap preparation or dependency slot.
spec_version: 3

bucket: noaa-nbm-grib2-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/swath-replay@sha256:f51c4d12ac0e1f52fd02f1a77a74e962d610d518e64ab8425635512370973612
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nbm-grib2-pds/current-eba31d9/part-*.parquet
  fixture_sha256: de7e0487fe7237590b421299853ff7f88f27a006f5d8528ece23f3be26a2624a
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 87
      pivot_probe: 37
      structure_probe: 51
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 32
  memory_gb: 64
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 20
  replay_memory_gb: 20
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 512
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  rclone:
    cases:
      - {mode: recursive-walk, concurrency: 64, purpose: diagnostic}

  s3-fast-list:
    cases:
      - {mode: list-hinted-fixture, concurrency: 100, segments: 1000, purpose: diagnostic}
      - {mode: list-hinted-fixture, concurrency: 100, segments: 1000, purpose: diagnostic, container_memory_gb: 16}

  s3p:
    cases:
      - {mode: ls, concurrency: 16, purpose: diagnostic}

  s5cmd:
    cases:
      - mode: fanout-with-dirs
        concurrency: 8
        purpose: diagnostic
        config:
          shard_prefixes: blend.2020_blend.2021_blend.2022_blend.2023_blend.2024_blend.2025_blend.2026_index.html

  s7cmd:
    cases:
      - mode: recursive-one-nosort
        concurrency: 16
        purpose: diagnostic
        config: {parallel_depth: 1}
      - mode: recursive-one-nosort
        concurrency: 4
        purpose: diagnostic
        config: {parallel_depth: 1}

  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: stopped after FourCast}
  - {tool: minio-mc, reason: stopped after FourCast}
  - {tool: ps3, reason: stopped after FourCast}
  - {tool: s3kor, reason: stopped after FourCast}
