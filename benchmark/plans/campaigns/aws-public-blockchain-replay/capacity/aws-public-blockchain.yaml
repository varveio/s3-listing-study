# 2026-09-01 post-fix Swath replay-capacity qualification. The seven earlier
# allocation controls remain in git and the unified ledger; this current plan
# starts with overprovisioned cell A only. Append B/C, then the selected common-
# allocation widths, here after A passes the declared replay-pressure gate.
spec_version: 3

bucket: aws-public-blockchain
region: us-east-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:3955f242f25294d3ebc6d63d3cf23e2a2694f7f1c9a5334dc6ec1054b0a69097
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/aws-public-blockchain/current-eba31d9/part-*.parquet
  fixture_sha256: f4a839f23a1be94047491339dfd1ae5dd40d075c5a7c2eac1e07156dd985d4b0
  serving_mode: sorted
  latency_model:
    deadlines_ms: {worker_page: 94, pivot_probe: 46, structure_probe: 55}
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 80
  memory_gb: 160
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 64
  replay_memory_gb: 20
  replay_parquet_connections: 128
  replay_max_concurrent_requests: 512
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  swath:
    cases:
      # A: c256 under the materially overprovisioned replay64 control.
      - mode: recursive-tsv-dataset
        concurrency: 256
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: stopped after FourCast}
  - {tool: minio-mc, reason: stopped after FourCast}
  - {tool: ps3, reason: stopped after FourCast}
  - {tool: s3-fast-list, reason: stopped after NBM memory control}
  - {tool: s3kor, reason: stopped after FourCast}
  - {tool: s5cmd, reason: blockchain preceded the fair NBM c64 fanout; carry on next rung}
  - {tool: rclone, reason: post-fix capacity qualification is Swath-only}
  - {tool: s3p, reason: post-fix capacity qualification is Swath-only}
  - {tool: s7cmd, reason: post-fix capacity qualification is Swath-only}
