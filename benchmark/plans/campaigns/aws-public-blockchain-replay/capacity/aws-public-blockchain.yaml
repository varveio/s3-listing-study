# Capacity continuation after NBM narrowed the active race to Swath and rclone.
# The Swath width bracket holds its 8-vCPU/output treatment fixed; later rows
# are appended here rather than split into per-control plans.
spec_version: 3

bucket: aws-public-blockchain
region: us-east-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:e63da67a02b3f5e9a7bb78621bca74b157b6a86acbce30af5f2d650a44aa27c5
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/aws-public-blockchain/current-eba31d9/part-*.parquet
  fixture_sha256: f4a839f23a1be94047491339dfd1ae5dd40d075c5a7c2eac1e07156dd985d4b0
  serving_mode: sorted
  latency_model:
    deadlines_ms: {worker_page: 94, pivot_probe: 46, structure_probe: 55}
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 32
  memory_gb: 64
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 20
  replay_memory_gb: 20
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 512
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  rclone:
    cases:
      - {mode: recursive-walk, concurrency: 64, purpose: diagnostic}
      - {mode: recursive-walk, concurrency: 128, purpose: diagnostic}

  s3p:
    cases:
      - {mode: ls, concurrency: 16, purpose: diagnostic}

  s7cmd:
    cases:
      - mode: recursive-one-nosort
        concurrency: 16
        purpose: diagnostic
        config: {parallel_depth: 1}

  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 64
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 128
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 256
        purpose: diagnostic
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 128
        purpose: diagnostic
        replay_parquet_connections: 128
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 256
        purpose: diagnostic
        replay_parquet_connections: 128
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 128
        purpose: diagnostic
        vcpus: 48
        memory_gb: 96
        replay_vcpus: 32
        replay_parquet_connections: 128
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0
      - mode: recursive-tsv-dataset
        concurrency: 256
        purpose: diagnostic
        vcpus: 48
        memory_gb: 96
        replay_vcpus: 32
        replay_parquet_connections: 128
        config:
          jvm_max_heap: 4g
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: stopped after FourCast}
  - {tool: minio-mc, reason: stopped after FourCast}
  - {tool: ps3, reason: stopped after FourCast}
  - {tool: s3-fast-list, reason: stopped after NBM memory control}
  - {tool: s3kor, reason: stopped after FourCast}
  - {tool: s5cmd, reason: blockchain preceded the fair NBM c64 fanout; carry on next rung}
