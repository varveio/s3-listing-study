# Swath (Go port) beside the Java capsule on the release fixture of nbm-replay.
# Replay image, fixture, latency deadlines, warm-up, machine, subject and replay
# allocation and timeout are copied from the release plan campaigns/nbm-replay/capacity/noaa-nbm-grib2-pds.yaml
# (that file is the record and is not edited). Every row writes its product.
# The Go rows state max_duration 30 s below timeout_s, as upstream asks of a hosted
# runner (tools/swath-go/docs/running.md). The Java rows keep the release rows'
# 4g heap; its sorted mode takes sort_merge_parallelism 8 as the release's sorted rows did.
spec_version: 3
bucket: noaa-nbm-grib2-pds
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:3955f242f25294d3ebc6d63d3cf23e2a2694f7f1c9a5334dc6ec1054b0a69097
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/noaa-nbm-grib2-pds/current-eba31d9/part-*.parquet
  fixture_sha256: de7e0487fe7237590b421299853ff7f88f27a006f5d8528ece23f3be26a2624a
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 87
      pivot_probe: 37
      structure_probe: 51
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 7200
  vcpus: 32
  memory_gb: 64
  container_memory_gb: 8
  subject_vcpus: 8
  replay_vcpus: 20
  replay_memory_gb: 20
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 512
  replay_prefetch: false
  replay_prefetch_max_windows: 96
  replay_heap_percent: 75

tools:
  swath-go:
    cases:
      - mode: recursive-parquet-sorted
        concurrency: 64
        purpose: diagnostic
        config: {max_duration: 7170s}
      - mode: recursive-tsv
        concurrency: 64
        purpose: diagnostic
        config: {max_duration: 7170s}
  swath:
    cases:
      - mode: recursive-parquet-sorted
        concurrency: 64
        purpose: diagnostic
        config: {jvm_max_heap: 4g, sort_merge_parallelism: 8}

exclude:
  - {tool: aws-cli, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: minio-mc, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: ps3, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: rclone, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: s3kor, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: s3p, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: s5cmd, reason: outside this Swath Go-and-Java side-by-side diagnostic}
  - {tool: s7cmd, reason: outside this Swath Go-and-Java side-by-side diagnostic}
