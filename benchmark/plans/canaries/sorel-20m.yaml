# Small multi-tool replay integration canary. This is row-count and runner-path
# evidence, not a capacity result or a comparative measurement.
spec_version: 3

bucket: sorel-20m
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:c76ab9ef8b7ac3e7bff207394fa60bdbecfe79d90228f1abe61819a923bc6d1d
  fixture_sha256: 5e86c54452e9ffc63c4591cc241529c2853e65fa47abc369fdde8b619bd23015
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 247
      pivot_probe: 105
      structure_probe: 92
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 900
  vcpus: 8
  memory_gb: 16
  subject_vcpus: 3
  container_memory_gb: 4
  replay_vcpus: 4
  replay_memory_gb: 4
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 64
  replay_prefetch: false
  replay_heap_percent: 75

tools:
  aws-cli:
    cases:
      - {mode: s3api-v2-text, purpose: diagnostic}
  minio-mc:
    cases:
      - {mode: recursive, purpose: diagnostic}
  ps3:
    cases:
      - {mode: list, purpose: diagnostic}
  rclone:
    cases:
      - {mode: recursive-fastlist, purpose: diagnostic}
  s3-fast-list:
    cases:
      - {mode: list, purpose: diagnostic}
  s3kor:
    cases:
      - {mode: list, purpose: diagnostic}
  s3p:
    cases:
      - {mode: ls, purpose: diagnostic}
  s5cmd:
    cases:
      - {mode: recursive, purpose: diagnostic}
  s7cmd:
    cases:
      - {mode: recursive-tsv, purpose: diagnostic}
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 64, purpose: diagnostic}

exclude:
  - tool: s4cmd
    reason: server scope — s4cmd speaks only v1 ListObjects, which the replay server
      does not implement; observed, not inferred
