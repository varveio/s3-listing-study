# Small multi-tool replay integration canary. Its sorted fixture is staged from
# an earlier committed smoke product and hash-checked before the server starts.
# This is runner-path evidence, not a capacity result or comparative measurement.
spec_version: 3

bucket: sorel-20m
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://s3-listing-study-results-29c02004/c-2026-08-18-study/sorel-20m/swath.44573b83a6d6.s1/native/listing/data/*.parquet
  fixture_sha256: 4cbcde031212ea0bf7091b7d1bf68e805185cabe55b02239217d3859dd2ddc59
  serving_mode: sorted
  latency_model:
    deadlines_ms:
      worker_page: 247
      pivot_probe: 105
      structure_probe: 92
    scale: 1.0
    jitter: none

defaults:
  reps: 1
  timeout_s: 900
  vcpus: 8
  memory_gb: 16
  subject_vcpus: 3
  container_memory_gb: 4
  replay_vcpus: 4
  replay_memory_gb: 4
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 64
  replay_prefetch: false
  replay_heap_percent: 75

tools:
  aws-cli:
    cases:
      - {mode: s3api-v2-text, purpose: diagnostic}
  minio-mc:
    cases:
      - {mode: recursive, purpose: diagnostic}
  ps3:
    cases:
      - {mode: list, purpose: diagnostic}
  rclone:
    cases:
      - {mode: recursive-fastlist, purpose: diagnostic}
  s3-fast-list:
    cases:
      - {mode: list, purpose: diagnostic}
  s3kor:
    cases:
      - {mode: list, purpose: diagnostic}
  s3p:
    cases:
      - {mode: ls, purpose: diagnostic}
  s5cmd:
    cases:
      - {mode: recursive, purpose: diagnostic}
  s7cmd:
    cases:
      - {mode: recursive-tsv, purpose: diagnostic}
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 64, purpose: diagnostic}

exclude:
  - tool: s4cmd
    reason: server scope — s4cmd speaks only v1 ListObjects, which the replay server
      does not implement; observed, not inferred
