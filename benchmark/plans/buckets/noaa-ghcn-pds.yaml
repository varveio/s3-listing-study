# Benchmark plan — noaa-ghcn-pds (AWS Open Data, NOAA GHCN daily).
#
# What to run against this bucket and on what box. A campaign executes this plan
# together with any others it covers, with its image set frozen; the campaign ID
# is what receipts group under, so it appears nowhere in here.
#
# This is not a registry entry. `data/registry.toml` binds a bucket to a
# reference manifest for the verification lineage; nothing in the attempt path
# reads it, and this bucket has no manifest. A plan stands alone.
#
# The workload is the whole bucket — every case lists all ~1M objects, and there
# is no prefix anywhere in a plan to narrow it with. Scoping a listing changes
# the row count a case should produce, which is a fact about a target rather
# than a knob a case may turn; a prefix worth studying gets its own plan.

spec_version: 2

bucket: noaa-ghcn-pds
region: us-east-1

# The role a case signs with, used only by the subjects that cannot list without
# one. Four of the eleven have no unsigned request path; the rest list
# anonymously, because signing adds a signature to every one of ~1,000 requests
# and that is a different measurement. Each capsule declares which it can issue,
# so the split is a fact about the tools rather than a choice restated here.
auth_role: public-read

defaults:
  # One attempt per case for now. Raising this is cheap on Batch, where reps are
  # separate tasks rather than added wall-clock, so the number to raise it to is
  # a question for a calibration run and not a guess.
  reps: 1

  # ~1M objects at the 1,000-key LIST page cap is ~1,000 sequential pages. The
  # worker's own default is 300s, which the one large-N measurement we have
  # (148,917 keys in 146s) says would kill most tools around the 15% mark.
  timeout_s: 3600

  # The shape, not a machine type: benchmark/plans/instances.yaml says which box that is.
  # The smallest modern shape — the families start at 2 GB per vCPU in their
  # highcpu form, so there is no 2 GB/2 vCPU box to ask for.
  vcpus: 2
  memory_gb: 4

# Every registered tool must appear here or under `exclude`; a tool that is
# simply absent is a validation error rather than a silent skip. All eleven run
# against this bucket, so there is nothing to exclude yet.
#
# An empty tool runs once, at the mode benchmark/plans/tools.yaml records for it, on the
# allocation above. Writing the name and stopping is the whole declaration.

tools:
  aws-cli:
  s5cmd:
  rclone:
  minio-mc:
  s7cmd:
  # The hinted path: cut the keyspace into `segments` ranges and list them in
  # parallel. `segments` is stated per row — the capsule declares it `Stated`,
  # with no default of its own — and the chain builds the cut-point file at
  # exactly that count. The explicit `list` row is the unhinted arm it is
  # measured against, and — once a prerequisite binds by shape — the attempt
  # whose keyspace the hinted row consumes.
  s3-fast-list:
    cases:
      - {mode: list}
      - {mode: list-hinted, segments: 16}
  s3kor:
  s4cmd:
  s3p:
  ps3:

  # The one tool with anything to say. Four rows, because four cases: only the
  # sorted mode has a reason to care about memory, and the others say so by
  # simply not being written twice.
  #
  # The sweep is the container ceiling, not the box: the box stays a 4 GB
  # n4-highcpu-2 throughout, and `docker run --memory` is what the process
  # actually feels. That holds every other variable still — same machine, same
  # cores, same neighbours — and it reaches values no machine type offers.
  #
  # The question is whether sorting still completes when it cannot buffer: at
  # 2 GB the JVM gets a 1.5 GB heap and has to spill.
  #
  # Expect the 2 GB cell to be the one that fails, and treat a kill as a result
  # rather than a surprise. It leaves ~512 MB for metaspace, code cache, thread
  # stacks, GC native memory and direct buffers, all charged to the same cgroup
  # — and MaxDirectMemorySize defaults to roughly the heap size. A sorting run
  # is the most buffer-hungry shape swath has, so SIGKILL is a plausible
  # outcome, and a different finding from "it spilled and finished".
  #
  # Every row states the ceiling, including the three that share one value: one
  # left out would resolve to no ceiling at all, and the ID would then say
  # nothing about the memory the run was given.
  swath:
    cases:
      - {mode: recursive-tsv, container_memory_gb: 4}
      - {mode: recursive-parquet, container_memory_gb: 4}
      - {mode: recursive-parquet-sorted, container_memory_gb: 2}
      - {mode: recursive-parquet-sorted, container_memory_gb: 4}
