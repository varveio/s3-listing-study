# idc-open-data, served by the swath replay server rather than by S3.
#
# 56,311,145 objects — 5.7x sorel-20m, and the reason this bucket exists as a
# plan: swath's concurrency is an AIMD limit that climbs from min(4, N), and on
# sorel it took 13 s of a 39 s run to reach its widest fan-out. A third of that
# measurement was the controller ramping. At ~61,600 pages this bucket gives
# steady state room to dominate, which is what a throughput number needs before
# it means anything.
#
# WHAT THIS PLAN MEASURES AGAINST IS NOT A BUCKET. Every case here runs beside a
# replay server serving this bucket's own captured listing, with per-request
# latency injected to the profile S3 actually gave that listing. A number from
# this plan is peak throughput against a non-throttling backend at a stated
# profile — never "speed against idc-open-data".
spec_version: 2

bucket: idc-open-data
region: us-east-1

auth_role: public-read

# The backend, stated once because none of it varies per case.
replay:
  # The fixture rides a layer of the server's own image, so the bytes served are
  # already part of an identity the attempt records. `fixture_sha256` is a digest
  # over the parts in key order — the same binding `input_artifact_sha256` gives
  # a consumed artifact, and the reason a misfiled fixture cannot survive into a
  # comparison.
  fixture_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server:idc-open-data
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  # Stated, never inferred. There used to be an `auto` that chose between sorted
  # and DuckDB serving; it was removed upstream precisely because a backend that
  # quietly becomes a different backend cannot be compared against itself.
  serving_mode: sorted
  # MEASURED, not chosen. These are the p50s S3 itself returned while producing
  # this very fixture, read from the run's own `probe_latency` block, whose call
  # classes are exactly the replay server's shape classifier:
  #
  #   worker_page      n=61,598  p50=107ms  p90=149ms  p99=224ms
  #   pivot_probe      n= 3,200  p50= 41ms  p90= 66ms  p99=150ms
  #   structure_probe  n= 1,295  p50= 49ms  p90=100ms  p99=284ms
  #
  # Note this bucket is roughly twice as fast per page as sorel-20m (107 ms
  # against 247 ms), which makes it the harder test of the two: demand on the
  # server scales inversely with the profile, so the same subject fan-out asks
  # for about twice the page rate here.
  inject_latency:
    worker_page: 107ms
    pivot_probe: 41ms
    structure_probe: 49ms

defaults:
  reps: 1
  timeout_s: 3600
  # `vcpus`/`memory_gb` are the BOX, as everywhere else — the pair
  # instances.yaml resolves a machine type from. The server's share below is
  # carved out of it and the subject gets the remainder, which is how the two
  # containers are actually pinned: disjoint cpusets over one machine's cores.
  vcpus: 16
  memory_gb: 64
  replay_vcpus: 8
  replay_memory_gb: 16
  # Above the widest fan-out any case here drives, and doubled because a
  # delimiter rollup holds a row-group reader and a range reader at once. Below
  # that, the server's cost starts varying with the client's concurrency — which
  # is the very axis this study exists to rank.
  replay_parquet_connections: 640

tools:
  # swath first and, for now, alone: the sizing ladder that established this
  # topology ran against it, so a discrepancy here is legible from both ends.
  # The other ten join once their endpoint wiring lands; the compat receipt
  # already proved each one can speak to this server.
  swath:
    cases:
      # The ramp. What is being looked for is the rung where throughput stops
      # rising while the server's `inject.overrun` counters stay at zero — that
      # is swath's own ceiling. A rung where throughput rises *and* the server
      # starts overrunning is not a result: it measured the server.
      #
      # On sorel this plateaued at ~250k keys/s with swath reaching only ~74
      # in-flight of a requested 256, on 3.9 of 8 cores — neither CPU-bound nor
      # holding its requested width. Whether that is swath's controller or an
      # unfinished ramp is exactly what a bucket this size answers.
      - {mode: recursive-tsv, concurrency: 64}
      - {mode: recursive-tsv, concurrency: 128}
      - {mode: recursive-tsv, concurrency: 256}
      - {mode: recursive-tsv, concurrency: 512}

# The other ten are not excluded on their merits — the compat receipt proved
# every one of them can list correctly against this server, and each one's
# endpoint flag is already known. They are excluded because the harness has no
# endpoint concept yet, so there is nothing to thread that flag through. This is
# a scaffolding gap, not a finding about any tool, and each line says so.
exclude:
  - tool: aws-cli
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: minio-mc
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      MC_HOST_s3 + MC_REGION through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: ps3
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: rclone
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      a quoted endpoint= in its connection string through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s3-fast-list
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s3kor
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --custom-endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s3p
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      the S3_ENDPOINT environment variable through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s5cmd
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s7cmd
    reason: the harness has no endpoint concept yet, so there is nothing to thread
      --target-endpoint-url through; the replay compat receipt already proved this tool lists
      correctly against the server
  - tool: s4cmd
    reason: server scope — s4cmd speaks only v1 ListObjects, which the replay server
      does not implement; observed, not inferred
