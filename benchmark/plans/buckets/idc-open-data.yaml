# idc-open-data, served by the swath replay server rather than by S3.
#
# 56,311,145 objects — 5.7x sorel-20m, and the reason this bucket exists as a
# plan: swath's concurrency is an AIMD limit that climbs from min(4, N), and on
# sorel it took 13 s of a 39 s run to reach its widest fan-out. A third of that
# measurement was the controller ramping. At ~61,600 pages this bucket gives
# steady state room to dominate, which is what a throughput number needs before
# it means anything.
#
# WHAT THIS PLAN MEASURES AGAINST IS NOT A BUCKET. Every case here runs beside a
# replay server serving this bucket's own captured listing, with per-request
# latency injected to the profile S3 actually gave that listing. A number from
# this plan is peak throughput against a non-throttling backend at a stated
# profile — never "speed against idc-open-data".
spec_version: 3

bucket: idc-open-data
region: us-east-1

auth_role: public-read

# The backend, stated once because none of it varies per case.
replay:
  # The fixture rides a layer of the server's own image, so the bytes served are
  # already part of an identity the attempt records. `fixture_sha256` is a digest
  # over the parts in key order — the same binding `input_artifact_sha256` gives
  # a consumed artifact, and the reason a misfiled fixture cannot survive into a
  # comparison.
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:78a22c71cb25792a5f28af3e1e43afeab766f5161d939004bed4c8b50e97ca91
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  # Stated, never inferred. There used to be an `auto` that chose between sorted
  # and DuckDB serving; it was removed upstream precisely because a backend that
  # quietly becomes a different backend cannot be compared against itself.
  serving_mode: sorted
  # MEASURED, not chosen. These are the p50s S3 itself returned while producing
  # this very fixture, read from the run's own `probe_latency` block, whose call
  # classes are exactly the replay server's shape classifier:
  #
  #   worker_page      n=61,598  p50=107ms  p90=149ms  p99=224ms
  #   pivot_probe      n= 3,200  p50= 41ms  p90= 66ms  p99=150ms
  #   structure_probe  n= 1,295  p50= 49ms  p90=100ms  p99=284ms
  #
  # Note this bucket is roughly twice as fast per page as sorel-20m (107 ms
  # against 247 ms), which makes it the harder test of the two: demand on the
  # server scales inversely with the profile, so the same subject fan-out asks
  # for about twice the page rate here.
  latency_model:
    deadlines_ms:
      worker_page: 107
      pivot_probe: 41
      structure_probe: 49
    scale: 1.0
    jitter: none
    injector_version: swath-replay-injector-v1
    semantics_version: deadline-floor-v1
  # No committed reference manifest exists for this fixture yet, so these rows
  # are diagnostic rather than measurements. This version identifies how that
  # diagnostic evidence is interpreted without claiming a calibrated capacity
  # advancement rule.
  evidence_protocol_version: replay-diagnostic-v1

defaults:
  reps: 1
  timeout_s: 3600
  # `vcpus`/`memory_gb` are the BOX, as everywhere else — the pair
  # instances.yaml resolves a machine type from. Every share below is explicit;
  # CPU totals exactly and memory does not overcommit.
  # Calibration uses an intentionally wide server control. Subject CPU changes
  # consume only the otherwise-idle host share, so the server and box stay
  # fixed while the subject scale is measured.
  vcpus: 32
  memory_gb: 64
  subject_vcpus: 8
  subject_memory_gb: 8
  host_reserved_vcpus: 4
  host_reserved_memory_gb: 8
  container_memory_gb: 8
  replay_vcpus: 20
  replay_memory_gb: 8
  # The preserved pilot showed that 640 eagerly decodes hundreds of footers and
  # can OOM at startup. A reader is released before injected sleep; 40 is held
  # constant here while admission remains wide enough for the largest arm.
  replay_parquet_connections: 40
  replay_max_concurrent_requests: 1024
  replay_prefetch: false
  replay_heap_percent: 75

tools:
  # Swath first and, for now, alone. These rows calibrate the subject-resource
  # and server-validity instrument; purpose=diagnostic means they cannot rank or
  # eliminate a candidate. Once the manifest is bound and the paired-control
  # rule is frozen, the selected matrix is promoted to measurement rows.
  swath:
    cases:
      # Keep the checked-in canary bounded. The resource matrix is frozen only
      # after this path passes one real Batch canary and the manifest is bound.
      - {mode: recursive-tsv, concurrency: 64, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 128, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 256, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 512, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}

# The other tools are outside this Swath resource-calibration plan, not excluded
# on merit. Endpoint wiring now exists for every compatible capsule; they join a
# later replay screening plan after the rig-validity rule is calibrated here.
exclude:
  - tool: aws-cli
    reason: outside the Swath-only replay resource-calibration scope
  - tool: minio-mc
    reason: outside the Swath-only replay resource-calibration scope
  - tool: ps3
    reason: outside the Swath-only replay resource-calibration scope
  - tool: rclone
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3-fast-list
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3kor
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3p
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s5cmd
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s7cmd
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s4cmd
    reason: server scope — s4cmd speaks only v1 ListObjects, which the replay server
      does not implement; observed, not inferred
