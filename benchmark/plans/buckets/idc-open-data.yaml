# idc-open-data, served by the swath replay server rather than by S3.
#
# 56,311,145 objects — 5.7x sorel-20m, and the reason this bucket exists as a
# plan: swath's concurrency is an AIMD limit that climbs from min(4, N), and on
# sorel it took 13 s of a 39 s run to reach its widest fan-out. A third of that
# measurement was the controller ramping. At ~61,600 pages this bucket gives
# steady state room to dominate, which is what a throughput number needs before
# it means anything.
#
# WHAT THIS PLAN MEASURES AGAINST IS NOT A BUCKET. Every case here runs beside a
# replay server serving this bucket's own captured listing, with no per-request
# latency injected. A number from this plan is a diagnostic of the whole-box
# replay/subject resource partition under maximum backend demand — never "speed
# against idc-open-data" and never a comparative measurement.
spec_version: 3

bucket: idc-open-data
region: us-east-1

auth_role: public-read

# The backend, stated once because none of it varies per case.
replay:
  # This diagnostic locates a whole-box resource partition under maximum replay
  # demand. It cannot make a comparative measurement or calibrate capacity by
  # declaration; the four runs must first produce complete evidence.
  capacity_status: uncalibrated
  # The fixture rides a layer of the server's own image, so the bytes served are
  # already part of an identity the attempt records. `fixture_sha256` is a digest
  # over the parts in key order — the same binding `input_artifact_sha256` gives
  # a consumed artifact, and the reason a misfiled fixture cannot survive into a
  # comparison.
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:78a22c71cb25792a5f28af3e1e43afeab766f5161d939004bed4c8b50e97ca91
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  # Stated, never inferred. There used to be an `auto` that chose between sorted
  # and DuckDB serving; it was removed upstream precisely because a backend that
  # quietly becomes a different backend cannot be compared against itself.
  serving_mode: sorted
  # Explicitly omit injected S3 latency. This is a distinct treatment and case
  # identity from the fixture's measured fixed profile: it asks how much replay
  # and subject CPU peak throughput needs when artificial waiting cannot hide a
  # saturated sidecar.
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  # `vcpus`/`memory_gb` are the BOX, as everywhere else — the pair
  # instances.yaml resolves a machine type from. Server and subject allocations
  # leave derived positive host CPU and memory headroom.
  # Keep the n4-highcpu-16 box fixed and assign 14 vCPU in every row, always
  # leaving two for the host. The rows move those same CPUs between replay and
  # Swath; no allocation is eligible for comparative measurement yet.
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 4
  container_memory_gb: 4
  replay_vcpus: 10
  replay_memory_gb: 8
  # The preserved pilot showed that 640 eagerly decodes hundreds of footers and
  # can OOM at startup. Twenty readers avoid that eager-footer cost while the
  # separate admission width remains high enough not to cap subject fan-out.
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 2048
  replay_prefetch: false
  replay_heap_percent: 75

tools:
  # Swath first and, for now, alone. These rows calibrate the subject-resource
  # and server-validity instrument; purpose=diagnostic means they validate the
  # result-summary path but cannot rank or eliminate a candidate. The replay block's
  # capacity_status remains uncalibrated until a receipted canary permits a
  # separate measurement plan.
  swath:
    cases:
      # Constant-total CPU partition sweep: r10-s4, r8-s6, r6-s8, r4-s10.
      # The first row inherits the defaults; the others override both shares.
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 8, subject_vcpus: 6}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 6, subject_vcpus: 8}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 4, subject_vcpus: 10}

# The other tools are outside this Swath resource-calibration plan, not excluded
# on merit. Endpoint wiring now exists for every compatible capsule; they join a
# later replay screening plan after the rig-validity rule is calibrated here.
exclude:
  - tool: aws-cli
    reason: outside the Swath-only replay resource-calibration scope
  - tool: minio-mc
    reason: outside the Swath-only replay resource-calibration scope
  - tool: ps3
    reason: outside the Swath-only replay resource-calibration scope
  - tool: rclone
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3-fast-list
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3kor
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s3p
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s5cmd
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s7cmd
    reason: outside the Swath-only replay resource-calibration scope
  - tool: s4cmd
    reason: server scope — s4cmd speaks only v1 ListObjects, which the replay server
      does not implement; observed, not inferred
