# The mode each tool runs when a plan names it without saying more.
#
# Shared by every bucket plan, because a tool's representative mode is a fact
# about the tool and not about any one bucket. Restating it per plan would mean
# the same active-roster lines in each, drifting apart one edit at a time.
#
# Not in tools/<tool>/build/image.json: that file is an exact-field-set contract
# for building the toolbox, and which mode a benchmark samples is not a
# property of the build.
#
# benchmark/tests/test_plan.py checks every mode here against the adapter that would
# have to implement it, so a rename in an adapter cannot leave this stale.

spec_version: 2

default_modes:
  aws-cli: s3api-v2-text
  minio-mc: recursive
  ps3: list
  rclone: recursive-hierarchical
  s3-fast-list: list
  s4cmd: recursive
  s3kor: list
  s3p: ls
  s5cmd: recursive
  s7cmd: recursive-tsv
  swath: recursive-tsv

# One owner decision applies to comparative and replay plans. The capsule and
# its historical receipts remain in the repository. A local plan may remove
# only this exclusion for the explicit one-attempt real-S3 canary; that does not
# revive s4cmd as a comparative or replay subject.
exclude:
  - {tool: s4cmd, reason: owner decision — excluded from comparative and replay runs}

# Tools whose runtime must be told how much of its memory it may use as heap.
#
# Only a managed runtime appears here, which is why this is not a plan's
# business: ten of the eleven toolbox tools have no heap to size, so a per-bucket
# `heap_percent` would have been a knob that most cases ignored and every plan
# restated. Go, Rust and Python tools take what they take.
#
# A JVM and V8 both default to a *fraction* of the memory they can see, so
# leaving them alone would make the runtime's own heuristic the independent
# variable rather than the memory a case asked for.
heap:
  # Of the memory a case lets the process see — its container ceiling, or the
  # whole box where there is none. The remainder is not waste: a JVM needs
  # non-heap memory for metaspace, code cache, threads and direct buffers, and
  # a container that hands all of it to the heap gets killed rather than
  # collected.
  #
  # The share and nothing else: which variable a runtime reads, and whether it
  # wants a proportion or a size in MiB, is the capsule's to render from the
  # share it is handed (`benchmark/docs/capsule-contract.md` § "The ceiling, and
  # the share of it"). Stating it here too put the same variable in the job
  # twice, and the worker refuses two sources for one key.
  percent: 75
