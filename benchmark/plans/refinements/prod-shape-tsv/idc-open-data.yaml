# Test the production-like 16-vCPU Swath listing envelope without sort/merge.
# Both rows use the same 48-vCPU box and write native TSV; only replay CPU
# changes. The IDC fixture is much smaller and differently shaped than the
# 1.049B-object sentinel-cogs production bucket, so this is a throughput-envelope
# diagnostic rather than a corpus-identical reproduction.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:78a22c71cb25792a5f28af3e1e43afeab766f5161d939004bed4c8b50e97ca91
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 48
  memory_gb: 96
  subject_vcpus: 16
  container_memory_gb: 32
  replay_vcpus: 8
  replay_memory_gb: 16
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 2048
  replay_prefetch: true
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 16}

exclude:
  - {tool: aws-cli, reason: outside the Swath production-shape diagnostic}
  - {tool: minio-mc, reason: outside the Swath production-shape diagnostic}
  - {tool: ps3, reason: outside the Swath production-shape diagnostic}
  - {tool: rclone, reason: outside the Swath production-shape diagnostic}
  - {tool: s3-fast-list, reason: outside the Swath production-shape diagnostic}
  - {tool: s3kor, reason: outside the Swath production-shape diagnostic}
  - {tool: s3p, reason: outside the Swath production-shape diagnostic}
  - {tool: s4cmd, reason: outside the Swath production-shape diagnostic}
  - {tool: s5cmd, reason: outside the Swath production-shape diagnostic}
  - {tool: s7cmd, reason: outside the Swath production-shape diagnostic}
