# Qualify current Swath and replay main together before a larger-bucket rerun.
# This is one exact-count diagnostic on a fresh n4-highcpu-16 VM. It deliberately
# asks only whether the new image/argv/evidence path works and whether replay has
# headroom; later resource or concurrency sweeps are separate plans.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://outcrop-listings-7764300e/buckets/ten_d9p0tui2ggqcmlg369eg/bk_d9pr0k1qkks4dto51im0/bk_inv_d9qhek79duh1l3v0pd4g/20260806T232400Z_47503a/data/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 8
  container_memory_gb: 8
  replay_vcpus: 6
  replay_memory_gb: 6
  replay_parquet_connections: 8
  replay_max_concurrent_requests: 512
  replay_prefetch: true
  replay_prefetch_max_windows: 24
  replay_heap_percent: 67

tools:
  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        config:
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: outside this Swath-main integration diagnostic}
  - {tool: minio-mc, reason: outside this Swath-main integration diagnostic}
  - {tool: ps3, reason: outside this Swath-main integration diagnostic}
  - {tool: rclone, reason: outside this Swath-main integration diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath-main integration diagnostic}
  - {tool: s3kor, reason: outside this Swath-main integration diagnostic}
  - {tool: s3p, reason: outside this Swath-main integration diagnostic}
  - {tool: s4cmd, reason: server scope — the replay server does not implement ListObjects v1}
  - {tool: s5cmd, reason: outside this Swath-main integration diagnostic}
  - {tool: s7cmd, reason: outside this Swath-main integration diagnostic}
