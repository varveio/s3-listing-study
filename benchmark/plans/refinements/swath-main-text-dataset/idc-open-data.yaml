# Requalify Swath main's retained TSV path on the receipted IDC allocation.
# The stdout control and three directory-writer arms are diagnostic only.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:a54dc2cf7b4035e4f57e3f5c1f4434292e2a31076bab557bafee3c00637716e0
  fixture_uri: gs://outcrop-listings-7764300e/buckets/ten_d9p0tui2ggqcmlg369eg/bk_d9pr0k1qkks4dto51im0/bk_inv_d9qhek79duh1l3v0pd4g/20260806T232400Z_47503a/data/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 6
  container_memory_gb: 4
  replay_vcpus: 8
  replay_memory_gb: 8
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 2048
  replay_prefetch: false
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}
      - {mode: recursive-tsv-dataset, concurrency: 1024, purpose: diagnostic, config: {text_writers: 3}}
      - {mode: recursive-tsv-dataset, concurrency: 1024, purpose: diagnostic, config: {text_writers: 4}}
      - {mode: recursive-tsv-dataset, concurrency: 1024, purpose: diagnostic, config: {text_writers: 8}}

exclude:
  - {tool: aws-cli, reason: outside the Swath main parallel-text diagnostic}
  - {tool: minio-mc, reason: outside the Swath main parallel-text diagnostic}
  - {tool: ps3, reason: outside the Swath main parallel-text diagnostic}
  - {tool: rclone, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s3-fast-list, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s3kor, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s3p, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s4cmd, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s5cmd, reason: outside the Swath main parallel-text diagnostic}
  - {tool: s7cmd, reason: outside the Swath main parallel-text diagnostic}
