# Constant-total refinement after establishing that prefetch reduces replay's
# CPU knee. These rows reassign the saved cores to Swath while preserving two
# host CPUs on n4-highcpu-16. The existing prefetch-on 8/6 cell is the upper
# neighbor; replay 4 was already saturated with only six subject CPUs.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:78a22c71cb25792a5f28af3e1e43afeab766f5161d939004bed4c8b50e97ca91
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 7
  container_memory_gb: 4
  replay_vcpus: 7
  replay_memory_gb: 8
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 2048
  replay_prefetch: true
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 6, subject_vcpus: 8}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 5, subject_vcpus: 9}

exclude:
  - {tool: aws-cli, reason: outside the Swath-only prefetch partition refinement}
  - {tool: minio-mc, reason: outside the Swath-only prefetch partition refinement}
  - {tool: ps3, reason: outside the Swath-only prefetch partition refinement}
  - {tool: rclone, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s3-fast-list, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s3kor, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s3p, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s4cmd, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s5cmd, reason: outside the Swath-only prefetch partition refinement}
  - {tool: s7cmd, reason: outside the Swath-only prefetch partition refinement}
