# Double every C4-32 Sentinel CPU partition. Intel C4 has no 64-vCPU shape, so
# this exact two-times CPU cell uses x86 C4D and divides its native 120 GiB as
# 60/45/15 GiB for Swath/replay/host. The Swath request ceiling, replay
# admission width, and Parquet reader count also double so the larger machine
# is not put behind the smaller machine's service limits.
spec_version: 3

bucket: sentinel-cogs
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://outcrop-listings-7764300e/buckets/ten_d9p0tui2ggqcmlg369eg/bk_d9pq073uljvf1ns08e7g/bk_inv_d9s5it6s7ju9ql951pig/20260809T105457Z_9a0760/data/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 64
  memory_gb: 120
  subject_vcpus: 32
  container_memory_gb: 60
  replay_vcpus: 28
  replay_memory_gb: 45
  replay_parquet_connections: 64
  replay_max_concurrent_requests: 1024
  replay_prefetch: true
  replay_prefetch_max_windows: 1024
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - mode: recursive-tsv-zstd
        purpose: diagnostic
        concurrency: 256
        config:
          text_writers: 8
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: minio-mc, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: ps3, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: rclone, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: s3kor, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: s3p, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: s4cmd, reason: server scope — the replay server does not implement ListObjects v1}
  - {tool: s5cmd, reason: outside this Swath-main C4 scaling diagnostic}
  - {tool: s7cmd, reason: outside this Swath-main C4 scaling diagnostic}
