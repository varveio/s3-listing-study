# Extend the current-main C4 diagnostic to a fixture large enough for the
# steady-state portion of the run to dominate. This keeps the IDC machine,
# CPU partition, and uncompressed parallel-TSV controls unchanged; only the
# captured bucket changes. The fixture is a completed, sorted four-part Swath
# capture with exactly 131,323,203 rows (3.94 GiB).
spec_version: 3

bucket: multimedia-commons
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://outcrop-listings-7764300e/buckets/ten_d9p0tui2ggqcmlg369eg/bk_d9prbrbebv9bh7u153d0/bk_inv_d9qhelu05v1nv48oeki0/20260806T232412Z_1a4738/data/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 32
  memory_gb: 64
  subject_vcpus: 16
  container_memory_gb: 16
  replay_vcpus: 14
  replay_memory_gb: 6
  replay_parquet_connections: 8
  replay_max_concurrent_requests: 512
  replay_prefetch: true
  replay_prefetch_max_windows: 24
  replay_heap_percent: 67

tools:
  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        config:
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: outside this Swath-main C4 diagnostic}
  - {tool: minio-mc, reason: outside this Swath-main C4 diagnostic}
  - {tool: ps3, reason: outside this Swath-main C4 diagnostic}
  - {tool: rclone, reason: outside this Swath-main C4 diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath-main C4 diagnostic}
  - {tool: s3kor, reason: outside this Swath-main C4 diagnostic}
  - {tool: s3p, reason: outside this Swath-main C4 diagnostic}
  - {tool: s4cmd, reason: server scope — the replay server does not implement ListObjects v1}
  - {tool: s5cmd, reason: outside this Swath-main C4 diagnostic}
  - {tool: s7cmd, reason: outside this Swath-main C4 diagnostic}
