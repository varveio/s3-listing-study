# These diagnostics deliberately select C4 without Local SSD. The retained
# compressed Sentinel product and fixture fit the existing boot disk, and the
# 64-vCPU row doubles CPU and memory without changing the storage class.
spec_version: 2

instances:
  - { vcpus: 32, memory_gb: 64, machine_type: c4-highcpu-32 }
  - { vcpus: 64, memory_gb: 128, machine_type: c4-highcpu-64 }
