# Production-shaped listing diagnostic with the serial TSV sink removed.
# This diagnostic deliberately tests the supported maximum of four Parquet writers.
spec_version: 3

bucket: sentinel-cogs
region: us-west-2
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:c7532c5385100630698a7083d3792b83db8fdfbf9c0ff54f57402dee1594ec90
  fixture_uri: gs://outcrop-listings-7764300e/buckets/ten_d9p0tui2ggqcmlg369eg/bk_d9pq073uljvf1ns08e7g/bk_inv_d9s5it6s7ju9ql951pig/20260809T105457Z_9a0760/data/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 34
  memory_gb: 68
  subject_vcpus: 16
  container_memory_gb: 32
  replay_vcpus: 16
  replay_memory_gb: 24
  replay_parquet_connections: 32
  replay_max_concurrent_requests: 4096
  replay_prefetch: true
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - mode: recursive-parquet
        concurrency: 1024
        parquet_writers: 4
        purpose: diagnostic

exclude:
  - {tool: aws-cli, reason: outside this Swath production-shape diagnostic}
  - {tool: minio-mc, reason: outside this Swath production-shape diagnostic}
  - {tool: ps3, reason: outside this Swath production-shape diagnostic}
  - {tool: rclone, reason: outside this Swath production-shape diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath production-shape diagnostic}
  - {tool: s3kor, reason: outside this Swath production-shape diagnostic}
  - {tool: s3p, reason: outside this Swath production-shape diagnostic}
  - {tool: s4cmd, reason: outside this Swath production-shape diagnostic}
  - {tool: s5cmd, reason: outside this Swath production-shape diagnostic}
  - {tool: s7cmd, reason: outside this Swath production-shape diagnostic}
