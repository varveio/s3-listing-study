# Reproduce the retained local IDC topology in Batch. The workstation has 32
# logical CPUs / 16 physical cores and pinned eight physical cores to replay
# plus eight to Swath. A 34-vCPU N4 custom VM gives each process 16 vCPUs and
# leaves two for the host/Batch agent. Keep the current fixture and tuned TSV
# controls fixed. This remains a diagnostic, not a comparative benchmark.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: ghcr.io/varveio/swath-replay@sha256:c5f4239abbce7772faa2d58c661192bd6a890e460158b5e56fcb8c51b573cb63
  fixture_uri: gs://s3-listing-study-results-29c02004/fixtures/swath-replay/idc-open-data/current-geometry-20260824/*.parquet
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 34
  memory_gb: 68
  subject_vcpus: 16
  container_memory_gb: 16
  replay_vcpus: 16
  replay_memory_gb: 6
  replay_parquet_connections: 8
  replay_max_concurrent_requests: 512
  replay_prefetch: true
  replay_prefetch_max_windows: 24
  replay_heap_percent: 67

tools:
  swath:
    cases:
      - mode: recursive-tsv-dataset
        concurrency: 16
        purpose: diagnostic
        config:
          text_writers: 3
          text_part_size: 1gb
          writeback_size: 32mb
          part_rotation_interval: "0"
          part_rotation_max_rows: 0

exclude:
  - {tool: aws-cli, reason: outside this Swath-main topology diagnostic}
  - {tool: minio-mc, reason: outside this Swath-main topology diagnostic}
  - {tool: ps3, reason: outside this Swath-main topology diagnostic}
  - {tool: rclone, reason: outside this Swath-main topology diagnostic}
  - {tool: s3-fast-list, reason: outside this Swath-main topology diagnostic}
  - {tool: s3kor, reason: outside this Swath-main topology diagnostic}
  - {tool: s3p, reason: outside this Swath-main topology diagnostic}
  - {tool: s4cmd, reason: server scope — the replay server does not implement ListObjects v1}
  - {tool: s5cmd, reason: outside this Swath-main topology diagnostic}
  - {tool: s7cmd, reason: outside this Swath-main topology diagnostic}
