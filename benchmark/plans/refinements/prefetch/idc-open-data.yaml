# Geometric replay-CPU search with the replay prefetch enabled. Swath stays fixed at
# the selected six-CPU allocation so this isolates how far prefetch lets the
# replay sidecar shrink. This remains diagnostic evidence: no injected latency,
# no comparative timing, and no capacity-status promotion.
spec_version: 3

bucket: idc-open-data
region: us-east-1
auth_role: public-read

replay:
  capacity_status: uncalibrated
  server_image_uri: us-east1-docker.pkg.dev/varve-oss/s3-listing-study/replay-server@sha256:78a22c71cb25792a5f28af3e1e43afeab766f5161d939004bed4c8b50e97ca91
  fixture_sha256: 943786a189afa827cb78a74ff0f0cc9f08ae13b5dbd547d3a19f60e0a3de304c
  serving_mode: sorted
  latency_model: none

defaults:
  reps: 1
  timeout_s: 3600
  vcpus: 16
  memory_gb: 32
  subject_vcpus: 6
  container_memory_gb: 4
  replay_vcpus: 8
  replay_memory_gb: 8
  replay_parquet_connections: 20
  replay_max_concurrent_requests: 2048
  replay_prefetch: true
  replay_heap_percent: 75

tools:
  swath:
    cases:
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 4}
      - {mode: recursive-tsv, concurrency: 1024, purpose: diagnostic, replay_vcpus: 2}

exclude:
  - {tool: aws-cli, reason: outside the Swath-only prefetch allocation search}
  - {tool: minio-mc, reason: outside the Swath-only prefetch allocation search}
  - {tool: ps3, reason: outside the Swath-only prefetch allocation search}
  - {tool: rclone, reason: outside the Swath-only prefetch allocation search}
  - {tool: s3-fast-list, reason: outside the Swath-only prefetch allocation search}
  - {tool: s3kor, reason: outside the Swath-only prefetch allocation search}
  - {tool: s3p, reason: outside the Swath-only prefetch allocation search}
  - {tool: s4cmd, reason: outside the Swath-only prefetch allocation search}
  - {tool: s5cmd, reason: outside the Swath-only prefetch allocation search}
  - {tool: s7cmd, reason: outside the Swath-only prefetch allocation search}
