# Committed chart specs for the public releases.
#
# A figure is an argument, so the rows behind it are declared here rather than
# chosen inside the renderer: each entry names its selection rule, its metric,
# its axis units, and the caption that bounds what the picture may be read to
# say. `benchmark/src/benchmark/public_render.py` draws exactly this and writes
# the selected rows beside each figure as CSV.
#
# `status: pending` entries are declared but not drawn.
spec_version: 1

charts:
  - id: nbm-same-allocation-wall
    status: rendered
    kind: bars
    title: NBM 66.4M-object replay fixture — wall clock at the same declared allocation
    # Explicit attempt ids, not a "best per tool" sweep: this figure exists to
    # compare three configurations that ran under one declared allocation, and
    # a rule that re-picked the fastest arm per tool would quietly change the
    # comparison the next time the release is cut.
    #
    #   rclone  c64 recursive-walk           nbm-capacity-20260828
    #   s5cmd   c64 fanout-fixture-with-dirs nbm-s5-fix-20260829 (the fair
    #           fanout arm; the 2026-08-28 s5cmd row ran at c8, a different
    #           allocation, and is not comparable here)
    #   swath   c64 recursive-tsv-dataset    nbm-capacity-20260828
    select:
      attempt_ids:
        - rclone.14e265d296a0.s1
        - s5cmd.962211b4b344.s1
        - swath.1a8598593dbb.s1
    metric: outcome.wall_seconds
    axis_label: wall seconds (lower is faster)
    series_label: "{tool.name} {tool.mode} c{tool.concurrency}"
    bar_label: "[{classification.replay_timing}]"
    caption: >-
      diagnostic; the Swath row is CAPACITY_FAILED (the instrument overran its structure-probe
      budget, which slows Swath) and a 0.2.5-SNAPSHOT build; the model's other skews are not
      measured, so no cross-tool ratio is established; output contracts differ per tool
    csv_columns:
      - attempt_id
      - group_id
      - tool.name
      - tool.version
      - tool.mode
      - tool.concurrency
      - classification.purpose
      - classification.capacity_status
      - classification.replay_timing
      - state.provider
      - outcome.row_count
      - outcome.wall_seconds
      - derived.wall_keys_per_second

  - id: s3-fast-list-rss
    status: rendered
    kind: scatter
    title: Peak RSS against fixture size — s3-fast-list, with Swath and rclone for reference
    select:
      where:
        tool.name: [s3-fast-list, swath, rclone]
        fixture.id:
          - noaa-nbm-grib2-pds/current-eba31d9
          - nara-1950-census/current-eba31d9
          - noaa-nws-fourcastnetgfs-pds/current-eba31d9
          - noaa-nws-fourcastnetgfs-pds/1b8be9d08d1006a5dc15dd0f190862c3871d664d3a8b68b4f7d2ddd7be8b0ad4
      pick: all
    # The x position is the staged fixture count where one exists (NBM) and,
    # where none was staged, the largest row count a successful run returned
    # off that fixture. The second is subject output, not fixture truth; it
    # positions a point on an axis and is never a count-match judgement. The
    # CSV carries both fields so a reader can see which applies to each row.
    x:
      - fixture.object_count
      - fixture.observed_row_counts.max
    y: outcome.max_rss_kb
    x_label: fixture objects (staged count; where none was staged, the largest row count a run returned)
    y_label: peak RSS (KiB)
    caption: >-
      diagnostic, rows from several campaigns and modes, not one series; a cross marks an
      attempt with no accepted result — on NBM one s3-fast-list attempt was killed at 8 GiB and
      one failed at 16 GiB with exit 0. Only NBM has a staged fixture count; see fixtures.json.
    csv_columns:
      - attempt_id
      - group_id
      - tool.name
      - tool.mode
      - tool.concurrency
      - fixture.id
      - fixture.object_count
      - fixture.observed_row_counts.max
      - state.provider
      - outcome.subject_exit_code
      - outcome.row_count
      - outcome.max_rss_kb
      - outcome.max_rss_floor_kb
      - machine.container_memory_gb

  - id: fourcast-roster
    status: rendered
    kind: bars
    title: FourCast 4.08M-object replay fixture — wall clock, one declared arm per tool
    # Explicit attempt ids, because "the arm that represents a tool" is a
    # judgement and belongs in a reviewable file. The rule applied here, once,
    # to every tool: the 8-vCPU / 8-GiB arm of `fc-cpu-corrected-20260828`,
    # the one group in which all ten subjects ran the same fixture at the same
    # declared allocation, and in which every one of these rows returned a
    # count matching the fixture's 4,081,170 objects. Ordered by wall clock so the figure
    # reads as a spread, not a ranking: the arms are not equivalent
    # configurations of a common tool, and three of them expose no listing
    # concurrency knob at all.
    #
    # Two asymmetries the caption names and the CSV carries: s3-fast-list ran
    # `list-hinted`, with cut-points supplied by the harness rather than
    # discovered by the tool, and Swath's row is CAPACITY_FAILED because the
    # replay server overran its structure-probe budget, which only slows Swath.
    select:
      attempt_ids:
        - rclone.4dc6bee15451.s1
        - s3-fast-list.8bd55064004a.s1
        - swath.88891b1437de.s1
        - s3p.bce7ef300683.s1
        - s7cmd.b5d4fe29dd1e.s1
        - ps3.55c79d26bce0.s1
        - s3kor.8514c3397199.s1
        - minio-mc.04c17e5ac8da.s1
        - s5cmd.9541d7894859.s1
        - aws-cli.a7d9377bd706.s1
    metric: outcome.wall_seconds
    axis_label: wall seconds (lower is faster)
    series_label: "{tool.name} {tool.mode}"
    bar_label: "[{classification.replay_timing}]"
    caption: >-
      diagnostic, not a ranking; one 8-vCPU/8-GiB arm per tool, one group, every count matched
      the fixture; only five rows are TIMING_VALID; s3-fast-list is hint-fed, Swath is a
      pre-release build and instrument-penalized; output contracts differ per tool
    csv_columns:
      - attempt_id
      - group_id
      - tool.name
      - tool.version
      - tool.mode
      - tool.concurrency
      - machine.subject_vcpus
      - machine.container_memory_gb
      - classification.purpose
      - classification.capacity_status
      - classification.replay_timing
      - state.provider
      - outcome.row_count
      - outcome.wall_seconds
      - outcome.max_rss_kb
      - derived.wall_keys_per_second

  - id: real-s3-ladder
    status: rendered
    kind: scatter
    title: Swath on live S3 — objects listed against whole-process rate (single observations)
    # Every settled real-S3 Swath row in the release, named rather than
    # filtered, so the figure cannot quietly change shape when a row is added.
    # These are uncontrolled observations against live public buckets, n=1
    # each, on machine types that differ between points; the picture is a
    # ladder of what one tool did once at each size, not a scaling curve and
    # not a comparison — no other subject has run on live S3 at all.
    select:
      attempt_ids:
        - swath.85ccd37c1b88.s1
        - swath.d7668a13dc4c.s1
        - swath.4b2db6e9f6a9.s1
        - swath.a0f1b2c053d8.s1
        - swath.0b5db9b35947.s1
        - swath.0d01af45ef74.s1
        - swath.6b1ffae260c0.s1
        - swath.7b028bd8c692.s1
    x: outcome.row_count
    y: derived.wall_keys_per_second
    x_label: objects listed (exact count returned by the run)
    y_label: objects per second over the whole process wall
    caption: >-
      diagnostic; live-S3 observations of one tool, n=1 per point, machine type and output mode
      differ between points; not a benchmark
    csv_columns:
      - attempt_id
      - group_id
      - target.bucket
      - target.region
      - tool.name
      - tool.version
      - tool.mode
      - tool.concurrency
      - machine.type
      - machine.vcpus
      - state.provider
      - outcome.row_count
      - outcome.wall_seconds
      - outcome.max_rss_kb
      - derived.wall_keys_per_second
