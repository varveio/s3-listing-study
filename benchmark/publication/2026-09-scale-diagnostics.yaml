# Release spec for the public result release `2026-09-scale-diagnostics`.
#
# This file holds the *release facts* — status, claim ceiling, what is included,
# what is excluded, and the declared group -> plan attribution. The exporter
# (`benchmark/src/benchmark/public_export.py`) holds no release facts of its
# own: change the release by changing this file, not the code.
spec_version: 1

release_id: 2026-09-scale-diagnostics
title: Scale-study replay diagnostics
# One of: diagnostic | benchmark | erratum.
status: diagnostic

# The machine-readable ceiling on what this release may be used to claim.
# Prose, charts and any generated site are bounded by these flags.
claim_ceiling:
  controlled_replay_diagnostics: true
  calibrated_replay_benchmark: false
  live_s3_performance: false
  universal_tool_ranking: false

# Every terminal attempt in the source ledger, whatever its state, purpose or
# tool. Selection is not a lever in this release: successes, failures,
# cancellations, preparations, canaries, replay rows and real-S3 rows all
# export.
include: all-terminal

exclusions:
  - rule: state not in the ledger's TERMINAL_STATES at export time
    reason: >-
      A running or queued attempt has no settled outcome. It is not hidden: the
      manifest records how many rows were skipped for this reason.

# Workloads withheld from the release entirely: rows, groups and fixture
# records. The manifest counts the withheld attempts; it does not name them.
withheld_workloads:
  sorel-20m: >-
    The SOREL-20M dataset licence does not permit publishing derived results,
    so the attempts against it stay in the private ledger.

source_ledger:
  suite: scale-study
  schema_version: 3

# Release-level disclosures. These are facts about how the campaigns were run
# that no attempt row can carry and the exporter cannot derive from the ledger;
# they are appended to manifest.json.disclosures verbatim.
disclosures:
  - id: multi-campaign-corpus
    detail: >-
      This release combines several diagnostic campaigns run between 2026-08-26 and
      2026-09-03 while the harness, the replay server and Swath were evolving. Every
      attempt pins its exact tool, image, platform, fixture and replay identities, but
      rows from different groups are not comparable merely because they share a release;
      the report's asymmetry table names the cases that matter.
    affects: every row
  - id: latency-model-is-not-s3
    detail: >-
      Replay applies one fixed deadline per request shape, taken from the median of the
      Swath capture run and checked against a serial client on the same bucket. It has no
      tail, no throttling and no rise under load, and it prices a request by its syntax.
      The serial checks are internal controls recorded in working notes, not published
      receipts. docs/instrument.md carries the model, its provenance and its known skews.
    affects: every row with replay != null
  - id: shared-host-disk
    detail: >-
      The replay server's fixture and the subject's output live on the same boot disk of
      one VM. CPU sets are separated by physical core; disk bandwidth, page cache and
      memory bandwidth are not, and no disk metric is exported.
    affects: every row with replay != null
  - id: prose-cites-private-evidence
    detail: >-
      Some statements in REPORT.md rest on the private run summary, the runner log or the
      tool's source rather than on a field of these rows (the listing-phase time inside a
      live-S3 run, a diagnosis of why a run was slow, a Spot preemption). The report labels
      each such statement with its source; none is a release field.
    affects: REPORT.md
  - id: fixtures-not-published
    detail: >-
      Fixtures are published as digests and shape metrics only. The fixture bytes and the
      original evidence store are private, and the source buckets are mutable, so the
      identical replay experiment cannot be rerun from this repository alone; the release
      is auditable, not independently reproducible.
    affects: every row with fixture != null
  - id: unreleased-swath-builds
    detail: >-
      Rows whose Swath version is 0.2.5-SNAPSHOT (2026-08) or 0.3.2-SNAPSHOT (2026-09-03) ran
      unreleased builds pinned by image digest: the 0.3.2-SNAPSHOT rows are the sink-channel fix
      (upstream #209, commit cc052c9) and its lane-routing follow-up (#210, commit 5cdaeaf,
      not merged) measured on sentinel-cogs before v0.3.2 was cut. They are diagnostics of a
      change, not release rows; the released-build rows of the same shapes are the s032-* groups.
    affects: every row with version ending in -SNAPSHOT
  - id: concurrent-live-s3-launches
    detail: >-
      Live-S3 rows launched in parallel from the same project and VPC (2026-09-02 four buckets;
      2026-09-03 the s032-s3-* groups) share the path out of the VPC. The sentinel-cogs 32-vCPU
      TSV row of 2026-09-03 listed 23 % slower while four other live-S3 jobs ran than the same
      build did alone earlier that morning, with S3 first-byte latency and sink waits both
      higher; the 64-vCPU row reproduced its solo figure within 2 %. Where a solo re-run exists
      it is the row to cite; the report names them.
    affects: every row with replay == null
  - id: roster-subject-not-run
    detail: >-
      s4cmd is a roster subject with no attempt in this release: it lists through the
      legacy ListObjects v1 API, which the replay server does not serve, and it requires
      credentials on live S3.
    affects: s4cmd

