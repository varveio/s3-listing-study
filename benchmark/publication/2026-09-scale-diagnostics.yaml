# Release spec for the public result release `2026-09-scale-diagnostics`.
#
# This file holds the *release facts* — status, claim ceiling, what is included,
# what is excluded, and the declared group -> plan attribution. The exporter
# (`benchmark/src/benchmark/public_export.py`) holds no release facts of its
# own: change the release by changing this file, not the code.
spec_version: 1

release_id: 2026-09-scale-diagnostics
title: Scale-study replay diagnostics
# One of: diagnostic | benchmark | erratum.
status: diagnostic

# The machine-readable ceiling on what this release may be used to claim.
# Prose, charts and any generated site are bounded by these flags.
claim_ceiling:
  controlled_replay_diagnostics: true
  calibrated_replay_benchmark: false
  live_s3_performance: false
  universal_tool_ranking: false

# Every terminal attempt in the source ledger, whatever its state, purpose or
# tool. Selection is not a lever in this release: successes, failures,
# cancellations, preparations, canaries, replay rows and real-S3 rows all
# export.
include: all-terminal

exclusions:
  - rule: state not in the ledger's TERMINAL_STATES at export time
    reason: >-
      A running or queued attempt has no settled outcome. It is not hidden: the
      manifest records how many rows were skipped for this reason.

# Workloads withheld from the release entirely: rows, groups and fixture
# records. The manifest counts the withheld attempts; it does not name them.
withheld_workloads:
  sorel-20m: >-
    The SOREL-20M dataset licence does not permit publishing derived results,
    so the attempts against it stay in the private ledger.

source_ledger:
  suite: scale-study
  schema_version: 3

# Group -> committed plan path. Declared, not inferred: the ledger records no
# plan path, so an attribution that is not certain is left out and the manifest
# discloses how many groups carry no plan. A wrong plan is worse than none.
plans:
  nbm-capacity-20260828: benchmark/plans/campaigns/nbm-replay/capacity/noaa-nbm-grib2-pds.yaml
  blockchain-capacity-20260829: benchmark/plans/campaigns/aws-public-blockchain-replay/capacity/aws-public-blockchain.yaml
