# Benchmark plan — noaa-ghcn-pds (AWS Open Data, NOAA GHCN daily).
#
# What to run against this bucket and on what box. A campaign executes this plan
# together with any others it covers, with its image set frozen; the campaign ID
# is what receipts group under, so it appears nowhere in here.
#
# This is not a registry entry. `data/registry.toml` binds a bucket to a
# reference manifest for the verification lineage; nothing in the attempt path
# reads it, and this bucket has no manifest. A plan stands alone.

spec_version: 1

bucket: noaa-ghcn-pds
region: us-east-1

defaults:
  # One attempt per case for now. Raising this is cheap on Batch, where reps are
  # separate tasks rather than added wall-clock, so the number to raise it to is
  # a question for a calibration run and not a guess.
  reps: 1

  # ~1M objects at the 1,000-key LIST page cap is ~1,000 sequential pages. The
  # worker's own default is 300s, which the one large-N measurement we have
  # (148,917 keys in 146s) says would kill most tools around the 15% mark.
  timeout_s: 3600

  # N4 is Intel Emerald Rapids (5th-gen Xeon) — a fixed modern core, unlike E2's
  # shared and variable one, which is not a platform to time anything on. The
  # modern families start at 2 GB per vCPU in their highcpu shapes, so 2 vCPU
  # comes with 4 GB and there is no 2 GB/2 vCPU box to ask for; the task takes
  # the 2 GB and the rest is headroom.
  #
  # Note for the Batch config: N4 and C4 do not support pd-balanced, the Compute
  # Engine default, and need hyperdisk-balanced or pd-ssd boot disks.
  resources:
    machine_type: n4-highcpu-2   # 2 vCPU / 4 GB
    memory_mib: 2048
    cpu_milli: 2000

# Every registered tool must appear here or under `exclude`; a tool that is
# simply absent is a validation error rather than a silent skip. All eleven run
# against this bucket, so there is nothing to exclude yet.
#
# An empty tool runs once, at the mode bench/tools.yaml records for it, on the
# allocation above. Writing the name and stopping is the whole declaration.

tools:
  aws-cli:
  s5cmd:
  rclone:
  minio-mc:
  s7cmd:
  s3-fast-list:
  s3kor:
  s4cmd:
  s3p:

  # No --prefix flag at all, so it always lists the whole bucket. That is this
  # plan's workload anyway, which is why it is comparable here and was not on
  # the scoped smoke prefix.
  ps3:

  # The one tool with anything to say. Two blocks, because the modes
  # do not all want the same sweep: only the sorted one has a reason to care
  # about memory, and a single cross-product would have run every mode at every
  # size to find that out.
  #
  # Memory varies as a per-task limit rather than by swapping machine types,
  # since two machine types differ in vCPU as well and the result could not be
  # attributed to memory. The block still needs a bigger box to hold the larger
  # limit: a 4096 MiB task does not fit beside the OS on a 4 GB VM.
  swath:
    matrix:
      - mode: [recursive-tsv, recursive-parquet]
        memory_mib: [2048]

      - mode: [recursive-parquet-sorted]
        memory_mib: [2048, 4096]
        resources:
          machine_type: n4-highcpu-4   # 4 vCPU / 8 GB
