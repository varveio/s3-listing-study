# Benchmark plan — noaa-ghcn-pds (AWS Open Data, NOAA GHCN daily).
#
# What to run against this bucket and on what box. A campaign executes this plan
# together with any others it covers, with its image set frozen; the campaign ID
# is what receipts group under, so it appears nowhere in here.
#
# This is not a registry entry. `data/registry.toml` binds a bucket to a
# reference manifest for the verification lineage; nothing in the attempt path
# reads it, and this bucket has no manifest. A plan stands alone.
#
# The workload is the whole bucket — every case lists all ~1M objects, and there
# is no prefix anywhere in a plan to narrow it with. Scoping a listing changes
# the row count a case should produce, which is a fact about a target rather
# than a knob a case may turn; a prefix worth studying gets its own plan.

spec_version: 1

bucket: noaa-ghcn-pds
region: us-east-1

defaults:
  # One attempt per case for now. Raising this is cheap on Batch, where reps are
  # separate tasks rather than added wall-clock, so the number to raise it to is
  # a question for a calibration run and not a guess.
  reps: 1

  # ~1M objects at the 1,000-key LIST page cap is ~1,000 sequential pages. The
  # worker's own default is 300s, which the one large-N measurement we have
  # (148,917 keys in 146s) says would kill most tools around the 15% mark.
  timeout_s: 3600

  # The shape, not a machine type: bench/instances.yaml says which box that is.
  # The smallest modern shape — the families start at 2 GB per vCPU in their
  # highcpu form, so there is no 2 GB/2 vCPU box to ask for.
  resources:
    vcpus: 2
    memory_gb: 4

# Every registered tool must appear here or under `exclude`; a tool that is
# simply absent is a validation error rather than a silent skip. All eleven run
# against this bucket, so there is nothing to exclude yet.
#
# An empty tool runs once, at the mode bench/tools.yaml records for it, on the
# allocation above. Writing the name and stopping is the whole declaration.

tools:
  aws-cli:
  s5cmd:
  rclone:
  minio-mc:
  s7cmd:
  s3-fast-list:
  s3kor:
  s4cmd:
  s3p:
  ps3:

  # The one tool with anything to say. Two blocks, because the modes do not all
  # want the same sweep: only the sorted one has a reason to care about memory,
  # and a single cross-product would have run every mode at every size to find
  # that out.
  #
  # vcpus stays at 2 across the sweep, so memory is the only thing that moves —
  # within a generation the highcpu/standard shapes at one vCPU count differ in
  # nothing else.
  swath:
    matrix:
      - mode: [recursive-tsv, recursive-parquet]
        memory_gb: [4]

      - mode: [recursive-parquet-sorted]
        memory_gb: [4, 8]
