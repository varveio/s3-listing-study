# The mode each tool runs when a plan names it without saying more.
#
# Shared by every bucket plan, because a tool's representative mode is a fact
# about the tool and not about any one bucket. Restating it per plan would mean
# eleven lines of the same thing in each, drifting apart one edit at a time.
#
# Not in tools/<tool>/build/image.json: that file is an exact-field-set contract
# for building the derived image, and which mode a benchmark samples is not a
# property of the build.
#
# tests/test_bench_plan.py checks every mode here against the adapter that would
# have to implement it, so a rename in an adapter cannot leave this stale.

spec_version: 1

default_modes:
  aws-cli: s3api-v2-text
  minio-mc: recursive
  ps3: list
  rclone: recursive-hierarchical
  s3-fast-list: list
  s3kor: list
  s3p: ls
  s4cmd: recursive
  s5cmd: recursive
  s7cmd: recursive-tsv
  swath: recursive-tsv

# Tools whose runtime must be told how much of its memory it may use as heap.
#
# Only a managed runtime appears here. Go and Rust tools (s5cmd, rclone,
# minio-mc, ps3, s3kor, s3-fast-list, s7cmd) and the Python ones (aws-cli,
# s4cmd) take what they take, and have no ceiling to set. A JVM and V8 both
# default to a *fraction* of the memory they can see, so leaving them alone
# would make the runtime's own heuristic the independent variable rather than
# the memory a case asked for.
#
# `{percent}` and `{mib}` are substituted from the case: the JVM reads its own
# cgroup ceiling and wants a proportion, V8 does not and wants a size.
heap:
  swath:
    env: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage={percent}"

  s3p:
    env: NODE_OPTIONS
    value: "--max-old-space-size={mib}"
