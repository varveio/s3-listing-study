# Example plan for campaign.py. Compare bench/buckets/noaa-ghcn-pds.yaml +
# bench/tools.yaml, which together express: per-tool mode defaults, a
# stratum (signed/unsigned), a fingerprinted case-ID scheme, and a
# container-memory sweep for one tool. None of that here -- a plan is just a
# flat list of (tool, mode) pairs run against one bucket, on one machine
# type, for one image.

bucket: noaa-ghcn-pds
region: us-east-1
location: us-central1
prefix: ""

results_bucket: my-results-bucket
image: us-docker.pkg.dev/my-project/s3-listing-study/simple-sketch:abc123
machine_type: n4-highcpu-2
repetitions: 1

tools:
  - name: aws-cli
    mode: s3api-v2-text
  - name: s5cmd
    mode: recursive
  - name: rclone
    mode: recursive-hierarchical
  - name: minio-mc
    mode: recursive
  - name: s7cmd
    mode: recursive-tsv
  - name: s3-fast-list
    mode: list
  - name: s3kor
    mode: list
  - name: s4cmd
    mode: recursive
  - name: s3p
    mode: ls
  - name: ps3
    mode: list

  # Two rows for the one tool with a memory question: swath's runtime is a
  # JVM, so campaign.py's render_batch_job sizes JAVA_TOOL_OPTIONS off
  # container_memory_gb via tools.heap_env_for() rather than the box's own
  # memory. job_id_for() folds container_memory_gb in so these render two
  # distinct job ids instead of colliding. Compare the real four-row sweep
  # in bench/buckets/noaa-ghcn-pds.yaml.
  - name: swath
    mode: recursive-tsv
    container_memory_gb: 4
  - name: swath
    mode: recursive-tsv
    container_memory_gb: 2
